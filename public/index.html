<!DOCTYPE html>
<html lang="my"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kachin Link</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d9232d">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box}
:root{--r:#d9232d;--g:#1f9d55;--ink:#1c1e21;--mut:#6b7280;--line:#eceef1;--sh:0 2px 14px rgba(20,30,50,.08)}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(135deg,#ffeceb 0%,#f4f6f8 45%,#e6f6ec 100%) fixed}
[hidden]{display:none!important}button{font:inherit;cursor:pointer;border:0;transition:.15s}
input,textarea{font:inherit;width:100%;padding:11px 14px;border:1.5px solid #e3e6ea;border-radius:12px;margin:4px 0;outline:0;background:#fff;transition:.15s}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(31,157,85,.15)}
textarea{resize:none}
.btn{background:linear-gradient(135deg,#e8343e,var(--r));color:#fff;padding:9px 18px;border-radius:999px;font-weight:600;box-shadow:0 3px 10px rgba(217,35,45,.28)}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,#27b567,var(--g));box-shadow:0 3px 10px rgba(31,157,85,.3)}
.btn.ghost{background:#eef0f3;color:#444;box-shadow:none}.btn:disabled{opacity:.5}
.logo{font-size:22px;font-weight:800;color:var(--r);cursor:pointer}.logo i{font-style:normal;color:var(--g)}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.pad{padding:16px}.ct{font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line)}
#auth{width:calc(100% - 56px);max-width:320px;margin:14vh auto;padding:22px 18px;background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,.18);text-align:center;border-top:5px solid var(--g)}
#auth .logo{font-size:26px!important}
#auth p{font-size:14px;margin:2px 0 10px!important}
#auth input{padding:10px 12px;font-size:15px}
#auth .btn{padding:10px;font-size:15px}
#auth a{color:var(--g);cursor:pointer;font-size:14px;font-weight:600}
.or{margin:6px 0 2px;color:#999;font-size:12px}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:3px solid var(--r)}
nav input{max-width:320px;margin:0;background:#f0f2f5;border-color:transparent;border-radius:999px}nav .sp{flex:1}
.wrap{max-width:1100px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:270px 1fr 300px;gap:18px;align-items:start}
.cover{height:84px;background:linear-gradient(120deg,var(--r) 50%,var(--g) 50%)}
.pcov{height:160px}
.prof{text-align:center;margin-top:-46px}
.pf2{margin-top:-58px}
.big{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#ccc;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pb{width:112px;height:112px}
.stats{display:flex;border-top:1px solid var(--line)}.stats div{flex:1;text-align:center;padding:12px;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:19px;color:var(--ink)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ccc;flex:none}
.row{display:flex;gap:10px;align-items:center}
.sg{display:flex;gap:10px;align-items:center;padding:9px 16px;cursor:pointer}.sg:hover{background:#f4f6f8}
.top{border-top:4px solid var(--r)}
.name{font-weight:600}.time{font-size:12px;color:#8a919a}
.media{width:calc(100% + 32px);margin:10px -16px 0;max-height:520px;object-fit:contain;background:#111;display:block}
.shared{border:1px solid #e3e6ea;border-radius:14px;padding:12px;margin-top:8px;background:#fafbfc;overflow:hidden}
.shared .media{width:calc(100% + 24px);margin:10px -12px -12px}
.sum{font-size:13px;color:var(--mut);padding:10px 0;display:flex;justify-content:space-between}
.acts{display:flex;border-top:1px solid var(--line);padding-top:6px;gap:4px}.acts>*{flex:1}
.acts button{background:none;color:var(--mut);padding:9px;border-radius:10px;font-weight:600;width:100%}
.acts button:hover{background:#f0f2f5}.acts .me{color:var(--r)}
.lw{position:relative}
.pk{display:none;position:absolute;bottom:46px;left:0;background:#fff;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:6px 10px;z-index:5}
.lw:hover .pk,.pk.show{display:flex}
.pk span{font-size:28px;cursor:pointer;padding:2px 4px;transition:transform .12s}.pk span:hover{transform:scale(1.4)}
.cm{display:flex;gap:8px;margin-top:10px}.cm div{background:#f0f2f5;border-radius:18px;padding:8px 14px;font-size:14px}
.del{color:var(--r);font-size:12px;background:none;margin-left:auto;padding:6px 10px;border-radius:8px}
#prev img{max-width:100%;max-height:240px;border-radius:14px;margin-top:8px}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:14px;background:#f7f8fa}
.msg{max-width:80%;background:#fff;padding:8px 14px;border-radius:18px 18px 18px 4px;font-size:14px;align-self:flex-start;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg.me{background:linear-gradient(135deg,#27b567,var(--g));color:#fff;align-self:flex-end;border-radius:18px 18px 4px 18px}
.msg img{max-width:100%;border-radius:12px;display:block}
.aw{position:relative;display:inline-block;flex:none;line-height:0}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#31c552;border:2px solid #fff}
.big+.dot{width:18px;height:18px;right:4px;bottom:6px}
.bdg{background:var(--r);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px;font-weight:700;font-style:normal;line-height:1.4}
#bell{position:relative;padding:9px 14px}#bb{position:absolute;top:-5px;right:-5px;margin:0}
#npn{position:fixed;top:62px;right:8px;width:min(340px,calc(100vw - 16px));max-height:70vh;overflow-y:auto;z-index:40;margin:0}
.nt{padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}.nt:hover{background:#f4f6f8}.nt.fr{background:#fff1f1}
.bio{font-size:14px;color:var(--ink);padding:2px 16px 8px;white-space:pre-wrap;text-align:center}
.intro{font-size:14px;color:var(--mut);padding:0 16px 10px;display:flex;flex-direction:column;gap:3px;align-items:center}
.ptabs{display:flex;border-top:1px solid var(--line)}
.ptabs button{flex:1;background:none;padding:12px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;border-radius:0}
.ptabs button.on{color:var(--g);border-bottom-color:var(--g)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:6px;background:#ddd}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:10px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#tabs{display:none}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;padding-bottom:76px}
 body[data-t=home] #L,body[data-t=home] #R,body[data-t=me] #L,body[data-t=me] #R,body[data-t=fr] #C,body[data-t=fr] #R,body[data-t=chat] #L,body[data-t=chat] #C{display:none}
 #tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);box-shadow:0 -2px 14px rgba(0,0,0,.1);z-index:20}
 #tabs button{flex:1;background:none;padding:13px 4px;font-size:14px;color:var(--mut)}#tabs button.on{color:var(--r);font-weight:700;border-top:3px solid var(--r)}
 nav input{max-width:none;min-width:0}.chat{height:60vh}nav{padding:10px 10px;gap:6px}nav .logo{display:none}
}
html.dark{--ink:#e4e6eb;--mut:#a0a6ae;--line:#2e3036;--sh:0 2px 14px rgba(0,0,0,.4);color-scheme:dark}
html.dark body{background:linear-gradient(135deg,#1c1011 0%,#121316 50%,#0f1a14 100%) fixed}
html.dark .card,html.dark #auth{background:#1e2025}
html.dark nav,html.dark #tabs{background:rgba(30,32,37,.95)}
html.dark input,html.dark textarea,html.dark nav input{background:#2a2d33;border-color:#3a3d44;color:#e4e6eb}
html.dark .btn.ghost{background:#2f3238;color:#ddd}
html.dark [style*="#eee"]{border-color:#2e3036!important}
html.dark .sg:hover,html.dark .acts button:hover,html.dark .nt:hover{background:#2a2d33}
html.dark .cm div,html.dark .msg{background:#2a2d33}
html.dark .msg.me{background:linear-gradient(135deg,#27b567,var(--g))}
html.dark .chat{background:#17181b}
html.dark .shared{background:#24262b;border-color:#3a3d44}
html.dark .pk{background:#2a2d33}
html.dark .big{border-color:#1e2025}
html.dark .dot{border-color:#1e2025}
html.dark .nt.fr{background:#2a1c1d}
html.dark .time{color:#9aa0a8}
html.dark #auth p{color:#a0a6ae!important}
</style>
</head><body data-t="home">

<div id="auth">
  <div class="logo" style="font-size:30px">Kachin <i>Link</i></div>
  <p style="color:#777;margin-top:4px">Hkap Tau La Ga Ai</p>
  <input id="rn" placeholder="Name" hidden>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (6 Number )">
  <button class="btn g" id="go" style="width:100%;margin:8px 0">Login</button>
  <div class="or">သို့မဟုတ်</div>
  <button class="btn ghost" id="gg" style="width:100%;margin:6px 0">🔵 Google နဲ့ ဝင်မယ်</button>
  <div id="err" style="color:var(--r);font-size:13px"></div>
  <a id="sw">New Creat Account</a>
</div>

<div id="app" hidden>
  <nav>
    <div class="logo" id="lg">Kachin <i>Link</i></div>
    <input id="q" placeholder="🔍 Find...">
    <span class="sp"></span>
    <button class="btn ghost" id="bell">🔔<b class="bdg" id="bb" hidden>0</b></button>
    <button class="btn ghost" id="th">🌙</button>
    <button class="btn ghost" id="out">Logout</button>
  </nav>
  <div class="card" id="npn" hidden><div class="ct">🔔 Notifications</div><div id="nl"></div></div>
  <div id="lb" hidden><img></div>

  <div class="wrap">
    <aside id="L">
      <div class="card">
        <div class="cover" id="mcv"></div>
        <div class="prof"><img class="big myav" data-pf="me" style="cursor:pointer"><div class="name" id="mn" data-pf="me" style="font-size:18px;margin:6px 0 10px;cursor:pointer"></div></div>
        <div class="stats"><div>Posts<b id="np">0</b></div><div>Friends<b id="nu">0</b></div></div>
        <div class="pad" style="border-top:1px solid #eee"><button class="btn g" data-pf="me" style="width:100%">👤 My Profile</button></div>
      </div>
      <div class="card" id="reqc" hidden><div class="ct">🔔 Friend Requests</div><div id="req"></div></div>
      <div class="card"><div class="ct">Friends</div><div id="fl" style="padding:4px 0"></div></div>
      <div class="card"><div class="ct">People</div><div id="sug" style="padding:4px 0"></div></div>
    </aside>

    <main id="C">
      <div id="pv"></div>
      <div class="card pad" id="ep" hidden>
        <b>✏️ Edit Profile</b>
        <label class="btn ghost" style="display:block;text-align:center;margin-top:8px">📷 Profile ပုံပြောင်းမယ်<input id="avf" type="file" accept="image/*" hidden></label>
        <label class="btn ghost" style="display:block;text-align:center;margin-top:6px">🖼 Cover ပြောင်းမယ်<input id="cvf" type="file" accept="image/*" hidden></label>
        <input id="epn" placeholder="နာမည်">
        <textarea id="epb" rows="2" placeholder="Bio (မိတ်ဆက်စာ)"></textarea>
        <input id="epl" placeholder="🏠 နေရပ် (Lives in)">
        <input id="epw" placeholder="💼 အလုပ် (Work)">
        <div class="row" style="margin-top:6px"><button class="btn g" id="sn" style="flex:1">Save</button><button class="btn ghost" id="ec" style="flex:1">Cancel</button></div>
      </div>
      <div class="card top pad" id="cmp">
        <div class="row" style="align-items:flex-start"><img class="av myav"><textarea id="txt" rows="2" placeholder="What's on your mind?"></textarea></div>
        <div id="prev"></div>
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <label class="btn ghost">📷 ပုံထည့်မယ်<input id="file" type="file" accept="image/*" hidden></label>
          <button class="btn" id="post">Post</button>
        </div>
      </div>
      <div id="ppl"></div>
      <div id="feed"></div>
    </main>

    <aside id="R">
      <div class="card"><div class="ct">💬 Messages<b class="bdg" id="tb2" hidden></b></div>
        <div id="plist"></div>
        <div id="conv" hidden>
          <div class="row pad" style="border-bottom:1px solid #eee;padding:8px 14px">
            <button class="btn ghost" id="bk" style="padding:6px 12px">←</button>
            <span class="aw"><img class="av" id="pa"><i class="dot" id="pd"></i></span><b id="pnm"></b>
          </div>
          <div class="chat" id="msgs"></div>
          <div class="row pad" style="padding-top:0">
            <label class="btn ghost" style="padding:9px 12px;margin:0">📷<input id="cimg" type="file" accept="image/*" hidden></label>
            <input id="ci" placeholder="စာရိုက်ပါ..."><button class="btn g" id="cs">ပို့</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div id="tabs"><button data-t="home" class="on">🏠 Home</button><button data-t="fr">👥 Friends</button><button data-t="chat">💬 Chat<b class="bdg" id="tb" hidden></b></button><button data-t="me">👤 Profile</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,GoogleAuthProvider,signInWithPopup,signInWithRedirect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,deleteDoc,deleteField,onSnapshot,query,orderBy,limit,where,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDYL20rK-JgxxOIMVaQwTurlVinXBL9q4k", authDomain:"jinghpaw-link.firebaseapp.com", projectId:"jinghpaw-link",
  storageBucket:"jinghpaw-link.firebasestorage.app", messagingSenderId:"790888296721", appId:"1:790888296721:web:1f238b0be41ac85d631cb0"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMO=["👍","❤️","😂","😮","😢","😡"];
const DEF="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect fill='%23bcc0c4' width='40' height='40'/%3E%3Ccircle cx='20' cy='15' r='7' fill='%23fff'/%3E%3Cellipse cx='20' cy='37' rx='13' ry='11' fill='%23fff'/%3E%3C/svg%3E";

// ---------- Theme ----------
const root=document.documentElement;
const setTheme=t=>{root.classList.toggle("dark",t==="dark");const b=document.getElementById("th");if(b)b.textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("th",t)}catch(e){}};
let saved=null;try{saved=localStorage.getItem("th")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
document.getElementById("th").onclick=()=>setTheme(root.classList.contains("dark")?"light":"dark");

let me=null,users={},posts=[],comments={},openC=new Set(),file=null,reg=false,started=false,q="";
let peer=null,dmMsgs=[],unDM=null,view=null,ptab="posts",notifs=[],fresh=new Set(),lastM={},dmW=new Set(),friends=[],fLoaded=false;

// ---------- Helpers ----------
const U=id=>users[id]||{name:"User",photo:""};
const av=id=>U(id).photo||DEF;
const on=id=>id===me?.uid||(Date.now()-(U(id).lastSeen||0)<150000);
const avw=(id,c="av")=>`<span class="aw"><img class="${c}" src="${esc(av(id))}">${on(id)?'<i class="dot"></i>':""}</span>`;
const when=t=>t?.toDate?t.toDate().toLocaleString("my-MM",{dateStyle:"medium",timeStyle:"short"}):"ယခုလေးတင်";
const act=async fn=>{try{await fn()}catch(e){alert(e.message)}};
const keep=fn=>{const k=document.activeElement?.dataset?.ci,v=document.activeElement?.value;fn();if(k){const i=$(`[data-ci="${k}"]`);if(i){i.value=v;i.focus()}}};
function shrink(f,max,q=.72){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;
  c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(f)})}
const setTab=t=>{$$("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));document.body.dataset.t=t};
const notify=(to,type,extra={})=>{if(!to||to===me.uid)return;addDoc(collection(db,"notifs"),{to,from:me.uid,type,...extra,read:false,createdAt:serverTimestamp()}).catch(()=>{})};

// ---------- Friends ----------
const fid=o=>[me.uid,o].sort().join("_");
const accIds=()=>friends.filter(f=>f.status==="accepted").map(f=>f.users.find(x=>x!==me.uid));
const fbtn=o=>{
  const f=friends.find(x=>x.users.includes(o)),s='style="padding:5px 12px;font-size:12px"';
  if(!f)return `<button class="btn g" ${s} data-f="add" data-u="${o}">➕ Add Friend</button>`;
  if(f.status==="accepted")return `<button class="btn ghost" ${s} data-f="rm" data-u="${o}">✓ Friends</button>`;
  if(f.from===me.uid)return `<button class="btn ghost" ${s} data-f="rm" data-u="${o}">Cancel</button>`;
  return `<button class="btn g" ${s} data-f="ok" data-u="${o}">Confirm</button><button class="btn ghost" ${s} data-f="rm" data-u="${o}">Delete</button>`;
};
const friendAct=(a,o)=>act(async()=>{
  if(a==="add"){await setDoc(doc(db,"friends",fid(o)),{from:me.uid,to:o,users:[me.uid,o],status:"pending"});notify(o,"friend")}
  if(a==="ok")await updateDoc(doc(db,"friends",fid(o)),{status:"accepted"});
  if(a==="rm"&&confirm("သေချာလား?"))await deleteDoc(doc(db,"friends",fid(o)));
});
// ကိုယ့် Friend စာရင်းကို ကိုယ့် user doc ထဲ ထပ်သိမ်း (တခြားသူ Profile ကနေ ကြည့်လို့ရအောင်)
function syncFl(){
  if(!me||!fLoaded||!users[me.uid])return;
  const a=accIds(),x=[...a].sort().join(","),y=[...(U(me.uid).fl||[])].sort().join(",");
  if(x!==y)updateDoc(doc(db,"users",me.uid),{fl:a}).catch(()=>{});
}

// ---------- Auth ----------
$("#sw").onclick=()=>{reg=!reg;$("#rn").hidden=!reg;$("#go").textContent=reg?"Creat Account":"Login";$("#sw").textContent=reg?"အကောင့်ရှိပြီးသား - Login":"New Creat Account"};
$("#go").onclick=async()=>{
  $("#err").textContent="";const e=$("#em").value.trim(),p=$("#pw").value;
  try{
    if(reg){const n=$("#rn").value.trim()||e.split("@")[0];const c=await createUserWithEmailAndPassword(auth,e,p);
      await setDoc(doc(db,"users",c.user.uid),{name:n,photo:"",createdAt:serverTimestamp()});}
    else await signInWithEmailAndPassword(auth,e,p);
  }catch(x){$("#err").textContent=x.code||x.message}
};
$("#gg").onclick=async()=>{
  $("#err").textContent="";
  const gp=new GoogleAuthProvider();
  try{await signInWithPopup(auth,gp)}
  catch(x){
    if(x.code==="auth/popup-blocked"||x.code==="auth/operation-not-supported-in-this-environment"){
      try{await signInWithRedirect(auth,gp)}catch(y){$("#err").textContent=y.code||y.message}
    }else if(x.code!=="auth/popup-closed-by-user"){$("#err").textContent=x.code||x.message}
  }
};
$("#out").onclick=async()=>{try{await updateDoc(doc(db,"users",me.uid),{lastSeen:0})}catch(e){}await signOut(auth);location.reload()};
onAuthStateChanged(auth,async u=>{
  if(!u)return;me=u;
  const d=await getDoc(doc(db,"users",u.uid));
  if(!d.exists())await setDoc(doc(db,"users",u.uid),{name:u.displayName||(u.email||"user").split("@")[0],photo:u.photoURL||"",createdAt:serverTimestamp()});
  $("#auth").hidden=true;$("#app").hidden=false;
  if(!started){started=true;start()}
});

// ---------- Tabs / Search ----------
$$("#tabs button").forEach(b=>b.onclick=()=>{
  const t=b.dataset.t;
  if(t==="home"){view=null;render()}
  if(t==="me"){view=me.uid;ptab="posts";render()}
  setTab(t);scrollChat();
});
$("#lg").onclick=()=>{view=null;setTab("home");render()};
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};

// ---------- Presence / DM watchers ----------
const beat=()=>me&&updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});
const reads=()=>U(me.uid).reads||{};
const unreadN=i=>(lastM[i]||[]).filter(m=>m.from!==me.uid&&m.t>(reads()[i]||0)).length;
function watchDM(id){
  if(dmW.has(id)||id===me.uid)return;dmW.add(id);
  onSnapshot(query(collection(db,"dms",[me.uid,id].sort().join("_"),"messages"),orderBy("createdAt","desc"),limit(10)),
    s=>{lastM[id]=s.docs.map(d=>{const x=d.data();return{from:x.from,t:x.createdAt?.toMillis?.()||Date.now()}});unreadUI()},()=>{});
}
function unreadUI(){
  const n=Object.keys(lastM).filter(i=>unreadN(i)>0).length;
  [$("#tb"),$("#tb2")].forEach(b=>{b.hidden=!n;b.textContent=n});
  renderChat();
}
function markRead(){
  if(!peer)return;
  const last=Math.max(0,...dmMsgs.filter(m=>m.from!==me.uid).map(m=>m.createdAt?.toMillis?.()||0));
  if(last>(reads()[peer]||0)){(U(me.uid).reads=reads())[peer]=last;updateDoc(doc(db,"users",me.uid),{[`reads.${peer}`]:last}).catch(()=>{});unreadUI()}
}

// ---------- Live data ----------
function start(){
  beat();setInterval(beat,90000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)beat()});
  setInterval(()=>{keep(render);renderChat()},60000);
  onSnapshot(query(collection(db,"friends"),where("users","array-contains",me.uid)),s=>{friends=s.docs.map(d=>d.data());fLoaded=true;syncFl();keep(render)},e=>console.error(e));
  onSnapshot(query(collection(db,"notifs"),where("to","==",me.uid)),s=>{notifs=s.docs.map(d=>({id:d.id,...d.data()}));bellUI()},e=>console.error(e));
  onSnapshot(collection(db,"users"),s=>{users={};s.forEach(d=>users[d.id]=d.data());
    const m=U(me.uid);
    $$(".myav").forEach(i=>i.src=av(me.uid));$("#mn").textContent=m.name;
    $("#mcv").style.background=m.cover?`url('${m.cover}') center/cover`:"";
    Object.keys(users).slice(0,40).forEach(watchDM);
    syncFl();keep(render);unreadUI();bellUI()});
  onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));keep(render)});
}

// ---------- Notifications ----------
const ntxt=n=>{const u=esc(U(n.from).name);
  return n.type==="react"?`${esc(n.emoji||"👍")} <b>${u}</b> က သင့်ပို့စ်ကို Reaction ပေးသည်`
  :n.type==="comment"?`💬 <b>${u}</b> က သင့်ပို့စ်မှာ Comment ရေးသည်`
  :n.type==="share"?`↗️ <b>${u}</b> က သင့်ပို့စ်ကို Share လုပ်သည်`
  :`👥 <b>${u}</b> က Friend Request ပို့သည်`};
function bellUI(){
  const sorted=[...notifs].sort((a,b)=>(b.createdAt?.toMillis?.()||Date.now())-(a.createdAt?.toMillis?.()||Date.now())).slice(0,30);
  const n=notifs.filter(x=>!x.read).length;
  $("#bb").hidden=!n;$("#bb").textContent=n>9?"9+":n;
  $("#nl").innerHTML=sorted.map(x=>`<div class="nt ${fresh.has(x.id)?"fr":""}" data-n="${x.id}" data-t="${x.type}" data-u="${x.from}" data-p="${x.postId||""}">${ntxt(x)}<div class="time">${when(x.createdAt)}</div></div>`).join("")||`<div class="pad time">Notification မရှိသေးပါ</div>`;
}
$("#bell").onclick=e=>{
  e.stopPropagation();const p=$("#npn");p.hidden=!p.hidden;
  if(!p.hidden){
    const un=notifs.filter(x=>!x.read);fresh=new Set(un.map(x=>x.id));bellUI();
    un.forEach(x=>updateDoc(doc(db,"notifs",x.id),{read:true}).catch(()=>{}));
  }
};

// ---------- Profile ----------
const openProfile=id=>{view=id==="me"?me.uid:id;ptab="posts";setTab("me");render();scrollTo(0,0)};
$("#sn").onclick=()=>act(async()=>{const n=$("#epn").value.trim();
  await updateDoc(doc(db,"users",me.uid),{...(n?{name:n}:{}),bio:$("#epb").value.trim(),lives:$("#epl").value.trim(),work:$("#epw").value.trim()});
  $("#ep").hidden=true;alert("သိမ်းပြီးပါပြီ ✅")});
$("#ec").onclick=()=>{$("#ep").hidden=true};
$("#avf").onchange=e=>act(async()=>{const f=e.target.files[0];if(!f)return;await updateDoc(doc(db,"users",me.uid),{photo:await shrink(f,300)});e.target.value=""});
$("#cvf").onchange=e=>act(async()=>{const f=e.target.files[0];if(!f)return;await updateDoc(doc(db,"users",me.uid),{cover:await shrink(f,640,.6)});e.target.value=""});

// ---------- Compose ----------
$("#file").onchange=e=>{file=e.target.files[0]||null;$("#prev").innerHTML=file?`<img src="${URL.createObjectURL(file)}">`:""};
$("#post").onclick=async()=>{
  const text=$("#txt").value.trim();if(!text&&!file)return;const b=$("#post");b.disabled=true;b.textContent="တင်နေသည်...";
  try{
    const data={uid:me.uid,text,image:file?await shrink(file,900):"",reactions:{},commentCount:0,createdAt:serverTimestamp()};
    await addDoc(collection(db,"posts"),data);
    $("#txt").value="";$("#prev").innerHTML="";file=null;$("#file").value="";
  }catch(e){alert("တင်မရပါ: "+(e.message||e))}
  b.disabled=false;b.textContent="Post";
};

// ---------- Feed ----------
const img=p=>p.image?`<img class="media" src="${esc(p.image)}" loading="lazy">`:"";
const person=([i,u])=>`<div class="sg" data-pf="${i}">${avw(i)}<span class="name" style="flex:1">${esc(u.name)}</span>${i===me.uid?"":fbtn(i)+`<button class="btn ghost" style="padding:5px 10px;font-size:12px" data-dm="${i}">💬</button>`}</div>`;
const chatRow=i=>{const n=unreadN(i);return `<div class="sg" data-dm="${i}">${avw(i)}<span class="name" style="flex:1">${esc(U(i).name)}</span>${n?`<b class="bdg">${n>9?"9+":n}</b>`:""}</div>`};
function postHTML(p){
  const rs=p.reactions||{},vals=Object.values(rs),mine=rs[me.uid],top=[...new Set(vals)].slice(0,3).join("");
  const sh=p.shared?`<div class="shared"><div class="row"><img class="av" src="${esc(av(p.shared.uid))}" style="width:30px;height:30px"><span class="name">${esc(U(p.shared.uid).name)}</span></div><div>${esc(p.shared.text)}</div>${img(p.shared)}</div>`:"";
  const cl=openC.has(p.id)?`<div>${(comments[p.id]||[]).map(c=>`<div class="cm"><img class="av" src="${esc(av(c.uid))}" style="width:30px;height:30px"><div><b>${esc(U(c.uid).name)}</b><br>${esc(c.text)}</div></div>`).join("")}
    <div class="cm"><input data-ci="${p.id}" placeholder="Comment...(Enter)" style="margin:0;border-radius:20px"></div></div>`:"";
  return `<div class="card pad" data-id="${p.id}">
    <div class="row"><span data-pf="${p.uid}" style="cursor:pointer">${avw(p.uid)}</span><div><div class="name" data-pf="${p.uid}" style="cursor:pointer">${esc(U(p.uid).name)}${p.shared?" <span class='time'>Share</span>":""}</div><div class="time">${when(p.createdAt)}${p.edited?" · ပြင်ပြီး":""}</div></div>
    ${p.uid===me.uid?`<span style="margin-left:auto"><button class="del" data-a="edit" style="margin:0">✏️ Edit</button><button class="del" data-a="del" style="margin:0">Delete</button></span>`:""}</div>
    <div style="margin-top:8px;white-space:pre-wrap">${esc(p.text)}</div>${p.shared?sh:img(p)}
    <div class="sum"><span>${vals.length?top+" "+vals.length:""}</span><span>${p.commentCount?p.commentCount+" မှတ်ချက်":""}</span></div>
    <div class="acts">
      <div class="lw"><div class="pk">${EMO.map(e=>`<span data-a="react" data-e="${e}">${e}</span>`).join("")}</div>
        <button data-a="like" class="${mine?"me":""}">${mine?mine:"👍 Like"}</button></div>
      <button data-a="cm">💬 Comment</button><button data-a="share">↗️ Share</button>
    </div>${cl}</div>`;
}
function render(){
  if(!me)return;
  $("#np").textContent=posts.filter(p=>p.uid===me.uid).length;
  const acc=accIds();
  $("#nu").textContent=acc.length;
  $("#fl").innerHTML=acc.map(i=>person([i,U(i)])).join("")||`<div class="pad time">သူငယ်ချင်း မရှိသေးပါ</div>`;
  const rq=friends.filter(f=>f.status==="pending"&&f.to===me.uid);
  $("#req").innerHTML=rq.map(f=>person([f.from,U(f.from)])).join("");
  $("#reqc").hidden=!rq.length;
  const match=([i,u])=>i!==me.uid&&(!q||(u.name||"").toLowerCase().includes(q));
  $("#sug").innerHTML=Object.entries(users).filter(match).slice(0,8).map(person).join("")||`<div class="pad time">မတွေ့ပါ</div>`;
  let html;
  if(view){
    const u=U(view),isMe=view===me.uid,fl=(isMe?acc:(u.fl||[])).filter(i=>users[i]);
    const cv=u.cover?`style="background:url('${u.cover}') center/cover"`:"";
    $("#pv").innerHTML=`<div class="card"><button class="btn ghost" data-bk style="margin:10px">← Back</button>
      <div class="cover pcov" ${cv}></div>
      <div class="prof pf2"><span class="aw"><img class="big pb" src="${esc(av(view))}">${on(view)?'<i class="dot"></i>':""}</span>
        <div class="name" style="font-size:22px;margin:8px 0 2px">${esc(u.name)}</div>
        <div class="time" style="margin-bottom:6px">${on(view)?"🟢 Online":"Offline"}</div></div>
      ${u.bio?`<div class="bio">${esc(u.bio)}</div>`:""}
      <div class="intro">${u.lives?`<div>🏠 Lives in <b>${esc(u.lives)}</b></div>`:""}${u.work?`<div>💼 Works at <b>${esc(u.work)}</b></div>`:""}<div>👥 <b>${fl.length}</b> Friends</div></div>
      <div class="pad row" style="justify-content:center;flex-wrap:wrap">${isMe?`<button class="btn g" data-edit>✏️ Edit Profile</button>`
        :`${fbtn(view)}<button class="btn ghost" style="padding:5px 12px;font-size:12px" data-dm="${view}">💬 Message</button>`}</div>
      <div class="ptabs">${[["posts","Posts"],["photos","Photos"],["friends","Friends"]].map(([k,n])=>`<button data-pt="${k}" class="${ptab===k?"on":""}">${n}</button>`).join("")}</div></div>`;
    $("#cmp").hidden=true;$("#ppl").innerHTML="";
    if(!isMe)$("#ep").hidden=true;
    if(ptab==="photos"){const ph=posts.filter(p=>p.uid===view&&p.image);
      html=`<div class="card pad">${ph.length?`<div class="pg">${ph.map(p=>`<img data-lb src="${esc(p.image)}" loading="lazy">`).join("")}</div>`:`<div class="time">ဓာတ်ပုံ မရှိသေးပါ</div>`}</div>`}
    else if(ptab==="friends")html=`<div class="card">${fl.map(i=>person([i,U(i)])).join("")||`<div class="pad time">သူငယ်ချင်း မရှိသေးပါ</div>`}</div>`;
    else html=posts.filter(p=>p.uid===view).map(postHTML).join("")||`<div class="card pad">ပို့စ်မရှိသေးပါ။</div>`;
  }else{
    $("#pv").innerHTML="";$("#ep").hidden=true;$("#cmp").hidden=false;
    const found=q?Object.entries(users).filter(match).slice(0,6):[];
    $("#ppl").innerHTML=found.length?`<div class="card"><div class="ct">👥 လူများ</div>${found.map(person).join("")}</div>`:"";
    html=posts.filter(p=>!q||((p.text||"")+U(p.uid).name).toLowerCase().includes(q)).map(postHTML).join("")||`<div class="card pad">ပို့စ်မရှိသေးပါ။</div>`;
  }
  $("#feed").innerHTML=html;
}
document.addEventListener("click",e=>{
  if(!e.target.closest("#npn,#bell"))$("#npn").hidden=true;
  if(e.target.closest("#lb")){$("#lb").hidden=true;return}
  const lb=e.target.closest("[data-lb]");if(lb){$("#lb img").src=lb.src;$("#lb").hidden=false;return}
  const nt=e.target.closest("[data-n]");
  if(nt){$("#npn").hidden=true;
    if(nt.dataset.t==="friend")openProfile(nt.dataset.u);
    else{view=null;setTab("home");render();setTimeout(()=>document.querySelector(`[data-id="${nt.dataset.p}"]`)?.scrollIntoView({behavior:"smooth",block:"center"}),60)}
    return}
  if(e.target.closest("[data-bk]")){view=null;setTab("home");render();return}
  const pt=e.target.closest("[data-pt]");if(pt){ptab=pt.dataset.pt;render();return}
  if(e.target.closest("[data-edit]")){const m=U(me.uid);
    $("#epn").value=m.name||"";$("#epb").value=m.bio||"";$("#epl").value=m.lives||"";$("#epw").value=m.work||"";
    $("#ep").hidden=false;$("#ep").scrollIntoView({behavior:"smooth"});return}
  const f=e.target.closest("[data-f]");if(f){friendAct(f.dataset.f,f.dataset.u);return}
  const d=e.target.closest("[data-dm]");if(d){openChat(d.dataset.dm);return}
  const pf=e.target.closest("[data-pf]");if(pf){openProfile(pf.dataset.pf);return}
  const t=e.target.closest("[data-a]");if(!t)return;const id=t.closest(".card")?.dataset.id,p=posts.find(x=>x.id===id),a=t.dataset.a;
  if(!p)return;
  if(a==="react"||a==="like"){
    const mine=p.reactions?.[me.uid];
    const val=a==="react"?(t.dataset.e===mine?null:t.dataset.e):(mine?null:"👍");
    act(async()=>{await updateDoc(doc(db,"posts",id),{[`reactions.${me.uid}`]:val===null?deleteField():val});if(val)notify(p.uid,"react",{postId:id,emoji:val})});
  }
  if(a==="cm"){if(openC.has(id))openC.delete(id);else{openC.add(id);subC(id)}render()}
  if(a==="edit"){const nt=prompt("ပို့စ်ကို ပြင်ပါ",p.text||"");if(nt===null)return;act(()=>updateDoc(doc(db,"posts",id),{text:nt.trim(),edited:true}))}
  if(a==="del"&&confirm("ဖျက်မလား?"))act(()=>deleteDoc(doc(db,"posts",id)));
  if(a==="share"){const note=prompt("မှတ်ချက်ထည့်မလား? (မထည့်လည်းရ)");if(note===null)return;const s=p.shared||p;
    act(()=>addDoc(collection(db,"posts"),{uid:me.uid,text:note,image:"",reactions:{},commentCount:0,createdAt:serverTimestamp(),
      shared:{uid:s.uid,text:s.text||"",image:s.image||""}}).then(()=>{notify(s.uid,"share",{postId:id});alert("မျှဝေပြီးပါပြီ ✅")}))}
});
// ဖုန်းမှာ Like ကိုဖိထားရင် Emoji ပေါ်
let lp;document.addEventListener("touchstart",e=>{
  if(!e.target.closest(".lw"))$$(".pk.show").forEach(x=>x.classList.remove("show"));
  const b=e.target.closest('[data-a="like"]');if(!b)return;
  lp=setTimeout(()=>b.parentElement.querySelector(".pk").classList.add("show"),350)},{passive:true});
document.addEventListener("touchend",()=>clearTimeout(lp));

const subbed=new Set();
function subC(id){if(subbed.has(id))return;subbed.add(id);
  onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt")),s=>{comments[id]=s.docs.map(d=>d.data());keep(render)})}
document.addEventListener("keydown",e=>{const i=e.target.dataset?.ci;if(!i||e.key!=="Enter")return;const text=e.target.value.trim();if(!text)return;e.target.value="";
  act(async()=>{await addDoc(collection(db,"posts",i,"comments"),{uid:me.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,"posts",i),{commentCount:increment(1)});notify(posts.find(x=>x.id===i)?.uid,"comment",{postId:i})})});

// ---------- Private Chat ----------
const cid=()=>[me.uid,peer].sort().join("_");
function openChat(id){
  if(!id||id===me.uid)return;
  peer=id;dmMsgs=[];if(unDM)unDM();
  unDM=onSnapshot(query(collection(db,"dms",cid(),"messages"),orderBy("createdAt"),limit(200)),s=>{dmMsgs=s.docs.map(d=>d.data());renderChat();markRead()},
    e=>alert("Chat ဖွင့်မရပါ: "+e.message));
  setTab("chat");renderChat();setTimeout(()=>$("#ci").focus(),50);
}
$("#bk").onclick=()=>{peer=null;if(unDM){unDM();unDM=null}dmMsgs=[];renderChat()};
function send(){
  const text=$("#ci").value.trim();if(!text||!peer)return;$("#ci").value="";
  act(()=>addDoc(collection(db,"dms",cid(),"messages"),{from:me.uid,text,createdAt:serverTimestamp()}));
}
$("#cs").onclick=send;
$("#ci").onkeydown=e=>{if(e.key==="Enter")send()};
$("#cimg").onchange=e=>act(async()=>{const f=e.target.files[0];if(!f||!peer)return;
  const image=await shrink(f,800,.6);
  await addDoc(collection(db,"dms",cid(),"messages"),{from:me.uid,text:"",image,createdAt:serverTimestamp()});e.target.value=""});
function scrollChat(){const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}
function renderChat(){
  if(!me)return;
  $("#plist").hidden=!!peer;$("#conv").hidden=!peer;
  if(!peer){
    const t=i=>(lastM[i]||[])[0]?.t||0;
    $("#plist").innerHTML=Object.keys(users).filter(i=>i!==me.uid).sort((a,b)=>t(b)-t(a)).map(chatRow).join("")||`<div class="pad time">မတွေ့ပါ</div>`;
    return;
  }
  $("#pa").src=av(peer);$("#pnm").textContent=U(peer).name;$("#pd").hidden=!on(peer);
  $("#msgs").innerHTML=dmMsgs.map(m=>`<div class="msg ${m.from===me.uid?"me":""}">${m.image?`<img src="${esc(m.image)}">`:""}${m.text?esc(m.text):""}</div>`).join("");
  scrollChat();
}
</script>
</body></html>
