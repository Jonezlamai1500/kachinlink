<!DOCTYPE html>
<html lang="my"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kachin Link</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d9232d">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box}
:root{--r:#d9232d;--g:#1f9d55;--ink:#1c1e21;--mut:#6b7280;--line:#eceef1;--sh:0 2px 14px rgba(20,30,50,.08)}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(135deg,#ffeceb 0%,#f4f6f8 45%,#e6f6ec 100%) fixed}
[hidden]{display:none!important}button{font:inherit;cursor:pointer;border:0;transition:.15s}
input,textarea{font:inherit;width:100%;padding:11px 14px;border:1.5px solid #e3e6ea;border-radius:12px;margin:4px 0;outline:0;background:#fff;transition:.15s}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(31,157,85,.15)}
textarea{resize:none}
.btn{background:linear-gradient(135deg,#e8343e,var(--r));color:#fff;padding:9px 18px;border-radius:999px;font-weight:600;box-shadow:0 3px 10px rgba(217,35,45,.28)}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,#27b567,var(--g));box-shadow:0 3px 10px rgba(31,157,85,.3)}
.btn.ghost{background:#eef0f3;color:#444;box-shadow:none}.btn:disabled{opacity:.5}
.logo{font-size:22px;font-weight:800;color:var(--r);cursor:pointer;white-space:nowrap;flex:none}.logo i{font-style:normal;color:var(--g)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.pad{padding:16px}.ct{font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line)}
#auth{width:calc(100% - 56px);max-width:320px;margin:14vh auto;padding:22px 18px;background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,.18);text-align:center;border-top:5px solid var(--g)}
#auth .logo{font-size:26px!important}
#auth p{font-size:14px;margin:2px 0 10px!important}
#auth input{padding:10px 12px;font-size:15px}
#auth .btn{padding:10px;font-size:15px}
#auth a{color:var(--g);cursor:pointer;font-size:14px;font-weight:600}
.or{margin:6px 0 2px;color:#999;font-size:12px}
#boot{text-align:center;margin-top:30vh}
#off{position:fixed;left:0;right:0;bottom:0;z-index:90;color:#fff;text-align:center;padding:8px 10px;font-size:13px;font-weight:600;background:#444}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(0,0,0,.08);border-bottom:3px solid var(--r);backdrop-filter:blur(8px)}
nav{display:flex;align-items:center;gap:8px;padding:8px 14px}
nav input{max-width:320px;margin:0;padding:8px 14px;font-size:14px;background:#f0f2f5;border-color:transparent;border-radius:999px}nav .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;background:#eef0f3;color:#444;display:flex;align-items:center;justify-content:center;padding:0;position:relative;flex:none}
.ib:active{transform:scale(.94)}
#bb{position:absolute;top:-4px;right:-4px;margin:0}
#mnu{position:fixed;top:58px;right:8px;width:220px;z-index:40;margin:0;padding:6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;padding:11px 12px;border-radius:10px;font-weight:600;color:var(--ink);text-align:left;font-size:14px}
.mi:hover{background:#f0f2f5}
.mic{display:flex}
#tabs{display:flex;flex-direction:column;position:fixed;left:0;top:57px;bottom:0;width:52px;gap:2px;padding:8px 0;background:rgba(255,255,255,.97);border-right:3px solid var(--r);z-index:15;overflow-y:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;height:48px;position:relative;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:0;border-left:3px solid transparent}
#tabs button.on{color:var(--r);border-left-color:var(--r)}
#tabs button.on .ic{fill:currentColor;fill-opacity:.14}
#tabs .ic{width:25px;height:25px}
#tabs .bdg{position:absolute;top:4px;right:2px;left:auto;margin:0}
.wrap{max-width:1100px;margin:18px auto;padding:0 12px 0 64px;display:grid;grid-template-columns:270px 1fr 300px;gap:18px;align-items:start}
.cover{height:84px;background:linear-gradient(120deg,var(--r) 50%,var(--g) 50%)}
.pcov{height:160px}
.prof{text-align:center;margin-top:-46px}
.pf2{margin-top:-58px}
.big{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#ccc;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pb{width:112px;height:112px}
.stats{display:flex;border-top:1px solid var(--line)}.stats div{flex:1;text-align:center;padding:12px;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:19px;color:var(--ink)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ccc;flex:none}
.row{display:flex;gap:10px;align-items:center}
.sg{display:flex;gap:10px;align-items:center;padding:9px 16px;cursor:pointer}.sg:hover{background:#f4f6f8}
.top{border-top:4px solid var(--r)}
.name{font-weight:600}.time{font-size:12px;color:#8a919a}
.media{width:calc(100% + 32px);margin:10px -16px 0;max-height:520px;object-fit:contain;background:#111;display:block}
.shared{border:1px solid #e3e6ea;border-radius:14px;padding:12px;margin-top:8px;background:#fafbfc;overflow:hidden}
.shared .media{width:calc(100% + 24px);margin:10px -12px -12px}
.sum{font-size:13px;color:var(--mut);padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.sum .lc{display:flex;align-items:center;gap:6px}
.acts{display:flex;border-top:1px solid var(--line);padding-top:4px;gap:2px}.acts>*{flex:1}
.acts button{background:none;color:var(--mut);padding:10px 4px;border-radius:10px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px}
.acts button .ic{width:23px;height:23px}
.acts button:hover{background:#f0f2f5}.acts .me{color:var(--r)}
.acts .me .ic{fill:currentColor;fill-opacity:.15}
.acts .emo{font-size:20px;line-height:1}
.lw{position:relative}
.pk{display:none;position:absolute;bottom:46px;left:0;background:#fff;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:6px 10px;z-index:5}
.lw:hover .pk,.pk.show{display:flex}
.pk span{font-size:28px;cursor:pointer;padding:2px 4px;transition:transform .12s}.pk span:hover{transform:scale(1.4)}
.cm{display:flex;gap:8px;margin-top:10px}.cm div{background:#f0f2f5;border-radius:18px;padding:8px 14px;font-size:14px}
.pw{position:relative;margin-left:auto}
.dots{width:36px;height:36px;border-radius:50%;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0}
.dots .ic{width:24px;height:24px}
.dots:hover{background:#f0f2f5}
.pmenu{position:absolute;right:0;top:38px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:6px;z-index:10;min-width:150px}
.pmenu button{display:flex;gap:10px;align-items:center;width:100%;background:none;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--ink);font-size:14px;text-align:left}
.pmenu button:hover{background:#f0f2f5}
.pmenu .rd{color:var(--r)}
#prev img{max-width:100%;max-height:240px;border-radius:14px;margin-top:8px}
.fake{flex:1;text-align:left;background:#f0f2f5;color:var(--mut);padding:11px 16px;border-radius:999px;font-size:15px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#co{position:fixed;inset:0;z-index:70;background:#fff;display:flex;flex-direction:column}
.coh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cot{flex:1;text-align:center;font-size:17px}
.cob{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#co textarea{flex:1;min-height:40vh;border:0;box-shadow:none;border-radius:0;font-size:18px;padding:8px 16px;margin:0;background:transparent;color:var(--ink)}
.cof{border-top:1px solid var(--line);padding:10px 12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:#f0f2f5;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
#cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cc{padding:7px 14px;border-radius:999px;background:#f0f2f5;color:var(--ink);font-weight:600;font-size:13px}
.cc.on{background:var(--g);color:#fff}
#sty{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
#sty::-webkit-scrollbar{display:none}
.sc{position:relative;flex:none;width:104px;height:176px;border-radius:14px;overflow:hidden;cursor:pointer;background:#ddd;color:#fff}
.sc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.sc .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc .ring{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:3px solid var(--g);object-fit:cover;z-index:2;background:#ccc}
.sc .stx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-weight:700;font-size:14px;z-index:1;word-break:break-word}
.sc span{position:absolute;left:8px;right:8px;bottom:8px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.sc.cr{background:#f0f2f5;color:var(--ink)}
.sc.cr::after{display:none}
.sc.cr img{position:absolute;top:0;left:0;width:100%;height:68%;object-fit:cover}
.sc.cr .plus{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--g);border:3px solid #fff;color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.sc.cr span{text-shadow:none;text-align:center;white-space:normal;left:4px;right:4px;bottom:10px}
#scr{position:fixed;inset:0;z-index:75;background:#000;display:flex;justify-content:center}
#scp{position:relative;width:100%;max-width:420px;height:100%;overflow:hidden}
#scimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sch{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:2}
#scr textarea{position:absolute;top:70px;left:0;right:0;bottom:90px;width:100%;height:calc(100% - 160px);background:transparent;border:0;box-shadow:none;border-radius:0;color:#fff;text-align:center;font-size:26px;font-weight:700;padding:28vh 20px 20px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.45);z-index:1;display:block}
#scr textarea::placeholder{color:rgba(255,255,255,.75)}
.scf{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px;z-index:2}
.scd{display:flex;gap:10px}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.5);padding:0}
.cdot.on{border-color:#fff}
.svx{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none}
#sv{position:fixed;inset:0;z-index:85;background:#000;display:flex;justify-content:center}
.svbox{position:relative;width:100%;max-width:420px;height:100%;overflow:hidden}
.svb{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
.svb i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;position:relative}
.svb i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.svb i.f::after{width:100%}
.svb i.a::after{animation:pf 5s linear forwards}
@keyframes pf{from{width:0}to{width:100%}}
.svh{position:absolute;top:20px;left:0;right:0;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:3}
.svh .name{color:#fff}.svh .time{color:#ddd}
.svc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.svc img{width:100%;height:100%;object-fit:contain}
.svt{position:absolute;color:#fff;font-size:26px;font-weight:700;text-align:center;padding:24px;text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:pre-wrap;word-break:break-word}
.svt.cap{bottom:40px;font-size:18px;background:rgba(0,0,0,.45);border-radius:12px;left:16px;right:16px;padding:10px}
.svz{position:absolute;top:80px;bottom:0;z-index:2;cursor:pointer}
.svz.l{left:0;width:35%}.svz.r{right:0;width:65%}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:14px;background:#f7f8fa}
.msg{max-width:80%;background:#fff;padding:8px 14px;border-radius:18px 18px 18px 4px;font-size:14px;align-self:flex-start;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg.me{background:linear-gradient(135deg,#27b567,var(--g));color:#fff;align-self:flex-end;border-radius:18px 18px 4px 18px}
.msg img{max-width:100%;border-radius:12px;display:block}
.aw{position:relative;display:inline-block;flex:none;line-height:0}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#31c552;border:2px solid #fff}
.big+.dot{width:18px;height:18px;right:4px;bottom:6px}
.bdg{background:var(--r);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px;font-weight:700;font-style:normal;line-height:1.4}
#npn{position:fixed;top:58px;right:8px;width:min(340px,calc(100vw - 16px));max-height:70vh;overflow-y:auto;z-index:40;margin:0}
.nt{padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}.nt:hover{background:#f4f6f8}.nt.fr{background:#fff1f1}
.bio{font-size:14px;color:var(--ink);padding:2px 16px 8px;white-space:pre-wrap;text-align:center}
.intro{font-size:14px;color:var(--mut);padding:0 16px 10px;display:flex;flex-direction:column;gap:3px;align-items:center}
.ptabs{display:flex;border-top:1px solid var(--line)}
.ptabs button{flex:1;background:none;padding:12px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;border-radius:0}
.ptabs button.on{color:var(--g);border-bottom-color:var(--g)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:6px;background:#ddd}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:10px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;margin-top:12px;padding-bottom:24px}
 body[data-t=home] #L,body[data-t=home] #R,body[data-t=me] #L,body[data-t=me] #R,body[data-t=fr] #C,body[data-t=fr] #R,body[data-t=chat] #L,body[data-t=chat] #C{display:none}
 body[data-t=news] #L,body[data-t=news] #R,body[data-t=edu] #L,body[data-t=edu] #R,body[data-t=know] #L,body[data-t=know] #R{display:none}
 body[data-t=fr] #mcard{display:none}
 nav{padding:7px 10px;gap:8px}
 nav .sp{display:none}
 nav input{flex:1;max-width:none;min-width:0}
 .logo{font-size:19px}
 .chat{height:60vh}
}
html.dark{--ink:#e4e6eb;--mut:#a0a6ae;--line:#2e3036;--sh:0 2px 14px rgba(0,0,0,.4);color-scheme:dark}
html.dark body{background:linear-gradient(135deg,#1c1011 0%,#121316 50%,#0f1a14 100%) fixed}
html.dark .card,html.dark #auth,html.dark #co{background:#1e2025}
html.dark #hd{background:rgba(30,32,37,.96)}
html.dark #tabs{background:#1e2025}
html.dark input,html.dark textarea,html.dark nav input{background:#2a2d33;border-color:#3a3d44;color:#e4e6eb}
html.dark .btn.ghost{background:#2f3238;color:#ddd}
html.dark .ib{background:#2f3238;color:#ddd}
html.dark .mi:hover{background:#2a2d33}
html.dark [style*="#eee"]{border-color:#2e3036!important}
html.dark .sg:hover,html.dark .acts button:hover,html.dark .nt:hover{background:#2a2d33}
html.dark .cm div,html.dark .msg{background:#2a2d33}
html.dark .msg.me{background:linear-gradient(135deg,#27b567,var(--g))}
html.dark .chat{background:#17181b}
html.dark .shared{background:#24262b;border-color:#3a3d44}
html.dark .pk,html.dark .pmenu{background:#2a2d33}
html.dark .dots:hover,html.dark .pmenu button:hover{background:#34373e}
html.dark .fake{background:#2a2d33}
html.dark .chip{background:#2f3238}
html.dark .cc{background:#2f3238;color:#e4e6eb}
html.dark .cc.on{background:var(--g);color:#fff}
html.dark .sc.cr{background:#2a2d33}
html.dark #co textarea{background:transparent}
html.dark #scr textarea{background:transparent}
html.dark .big{border-color:#1e2025}
html.dark .dot{border-color:#1e2025}
html.dark .nt.fr{background:#2a1c1d}
html.dark .time{color:#9aa0a8}
html.dark .svh .time{color:#ddd}
html.dark #auth p{color:#a0a6ae!important}
</style>
</head><body data-t="home">

<div id="boot">
  <div class="logo" style="font-size:30px">Kachin <i>Link</i></div>
  <div class="time" style="margin-top:8px" data-i="boot"></div>
</div>

<div id="auth" hidden>
  <div class="logo" style="font-size:30px">Kachin <i>Link</i></div>
  <p style="color:#777;margin-top:4px">Hkap Tau La Ga Ai</p>
  <input id="rn" data-ph="phName" hidden>
  <input id="em" type="email" data-ph="phEmail">

<div id="app" hidden>

      <input id="q" data-ph="search">
      <span class="sp"></span>

      <button class="ib" id="mb" title="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  <div id="tabs">
    <button data-t="home" class="on" title="Home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>

    <button data-t="news" title="News"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7"/></svg></button>

    <button data-t="know" title="Knowledge"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>

const accIds=()=>friends.filter(f=>f.status==="accepted").map(f=>f.users.find(x=>x!==me.uid));
const fbtn=o=>{
  const f=friends.find(x=>x.users.includes(o)),s='style="padding:5px 12px;font-size:12px"';
  if(!f)return `<button class="btn g" ${s} data-f="add" data-u="${o}">${t("add")}</button>`;
  if(f.status==="accepted")return `<button class="btn ghost" ${s} data-f="rm" data-u="${o}">${t("isFr")}</button>`;
  if(f.from===me.uid)return `<button class="btn ghost" ${s} data-f="rm" data-u="${o}">${t("cancelReq")}</button>`;
  return `<button class="btn g" ${s} data-f="ok" data-u="${o}">${t("confirm")}</button><button class="btn ghost" ${s} data-f="rm" data-u="${o}">${t("delete")}</button>`;
};
const friendAct=(a,o)=>act(async()=>{
  if(a==="add"){await setDoc(doc(db,"friends",fid(o)),{from:me.uid,to:o,users:[me.uid,o],status:"pending"});notify(o,"friend")}
  if(a==="ok")await updateDoc(doc(db,"friends",fid(o)),{status:"accepted"});
  if(a==="rm"&&confirm(t("sure")))await deleteDoc(doc(db,"friends",fid(o)));
});
function syncFl(){
  if(!me||!fLoaded||!users[me.uid]||!navigator.onLine)return;
  const a=accIds(),x=[...a].sort().join(","),y=[...(U(me.uid).fl||[])].sort().join(",");
  if(x!==y)updateDoc(doc(db,"users",me.uid),{fl:a}).catch(()=>{});
}

// ---------- Auth ----------
$("#sw").onclick=()=>{reg=!reg;$("#rn").hidden=!reg;applyLang()};
$("#go").onclick=async()=>{
  if(offl())return;
  $("#err").textContent="";const e=$("#em").value.trim(),p=$("#pw").value;
  try{
    if(reg){const n=$("#rn").value.trim()||e.split("@")[0];const c=await createUserWithEmailAndPassword(auth,e,p);
      await setDoc(doc(db,"users",c.user.uid),{name:n,photo:"",createdAt:serverTimestamp()});}
    else await signInWithEmailAndPassword(auth,e,p);
  }catch(x){$("#err").textContent=x.code||x.message}
};
$("#gg").onclick=async()=>{
  if(offl())return;
  $("#err").textContent="";
  const gp=new GoogleAuthProvider();
  try{await signInWithPopup(auth,gp)}
  catch(x){
    if(x.code==="auth/popup-blocked"||x.code==="auth/operation-not-supported-in-this-environment"){
      try{await signInWithRedirect(auth,gp)}catch(y){$("#err").textContent=y.code||y.message}
    }else if(x.code!=="auth/popup-closed-by-user"){$("#err").textContent=x.code||x.message}
  }
};
$("#out").onclick=async()=>{
  if(navigator.onLine)updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()-151000}).catch(()=>{});
  try{await signOut(auth)}catch(e){}
  location.reload();
};
onAuthStateChanged(auth,u=>{
  if(!u){$("#boot").hidden=true;$("#app").hidden=true;$("#auth").hidden=false;return}
  me=u;
  getDoc(doc(db,"users",u.uid)).then(d=>{
    if(!d.exists())return setDoc(doc(db,"users",u.uid),{name:u.displayName||(u.email||"user").split("@")[0],photo:u.photoURL||"",createdAt:serverTimestamp()});
  }).catch(()=>{});
  $("#boot").hidden=true;$("#auth").hidden=true;$("#app").hidden=false;
  if(!started){started=true;start()}
});

  setTab(tb);
  if(tb==="home"||tb==="news"||tb==="edu"||tb==="know"){view=null;render();scrollTo(0,0)}

$("#mb").onclick=e=>{e.stopPropagation();$("#npn").hidden=true;$("#mnu").hidden=!$("#mnu").hidden};

// ---------- Presence / DM watchers ----------
const beat=()=>me&&navigator.onLine&&updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});
// ---------- Online / Offline banner ----------
const offB=$("#off");let offT;
const netUI=()=>{
  clearTimeout(offT);
  if(!navigator.onLine){offB.textContent=t("offB");offB.style.background="#444";offB.hidden=false}
  else if(!offB.hidden){offB.textContent=t("onB");offB.style.background="#1f9d55";offT=setTimeout(()=>{offB.hidden=true},2500);beat()}
};
addEventListener("online",netUI);addEventListener("offline",netUI);netUI();

const reads=()=>U(me.uid).reads||{};
const unreadN=i=>(lastM[i]||[]).filter(m=>m.from!==me.uid&&m.t>(reads()[i]||0)).length;
function watchDM(id){
  if(dmW.has(id)||id===me.uid)return;dmW.add(id);
  onSnapshot(query(collection(db,"dms",[me.uid,id].sort().join("_"),"messages"),orderBy("createdAt","desc"),limit(10)),
    s=>{lastM[id]=s.docs.map(d=>{const x=d.data();return{from:x.from,t:x.createdAt?.toMillis?.()||Date.now()}});unreadUI()},()=>{});
}
function unreadUI(){
  const n=Object.keys(lastM).filter(i=>unreadN(i)>0).length;
  [$("#tb"),$("#tb2")].forEach(b=>{b.hidden=!n;b.textContent=n});
  renderChat();
}
function markRead(){
  if(!peer)return;
  const last=Math.max(0,...dmMsgs.filter(m=>m.from!==me.uid).map(m=>m.createdAt?.toMillis?.()||0));
  if(last>(reads()[peer]||0)){(U(me.uid).reads=reads())[peer]=last;if(navigator.onLine)updateDoc(doc(db,"users",me.uid),{[`reads.${peer}`]:last}).catch(()=>{});unreadUI()}
}

// ---------- Live data ----------
function start(){
  beat();setInterval(beat,90000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)beat()});
  setInterval(()=>{keep(render);renderChat();storiesUI()},60000);
  onSnapshot(query(collection(db,"friends"),where("users","array-contains",me.uid)),s=>{friends=s.docs.map(d=>d.data());fLoaded=true;syncFl();keep(render)},e=>console.error(e));
  onSnapshot(query(collection(db,"notifs"),where("to","==",me.uid)),s=>{notifs=s.docs.map(d=>({id:d.id,...d.data()}));bellUI()},e=>console.error(e));
  onSnapshot(collection(db,"users"),s=>{users={};s.forEach(d=>users[d.id]=d.data());
    const m=U(me.uid);
    $$(".myav").forEach(i=>i.src=av(me.uid));$("#mn").textContent=m.name;$("#con").textContent=m.name;
    $("#mcv").style.background=m.cover?`url('${m.cover}') center/cover`:"";
    Object.keys(users).slice(0,40).forEach(watchDM);
    syncFl();keep(render);unreadUI();bellUI();storiesUI()});
  onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));keep(render)});
  onSnapshot(query(collection(db,"stories"),orderBy("createdAt","desc"),limit(60)),s=>{stories=s.docs.map(d=>({id:d.id,...d.data()}));storiesUI()},e=>console.error(e));
}

// ---------- Notifications ----------
const ntxt=n=>{const u=esc(U(n.from).name);
  return n.type==="react"?`${esc(n.emoji||"👍")} <b>${u}</b> ${t("nReact")}`
  :n.type==="comment"?`💬 <b>${u}</b> ${t("nComment")}`
  :n.type==="share"?`↗️ <b>${u}</b> ${t("nShare")}`
  :`👥 <b>${u}</b> ${t("nFriend")}`};
function bellUI(){
  const sorted=[...notifs].sort((a,b)=>(b.createdAt?.toMillis?.()||Date.now())-(a.createdAt?.toMillis?.()||Date.now())).slice(0,30);
  const n=notifs.filter(x=>!x.read).length;
  $("#bb").hidden=!n;$("#bb").textContent=n>9?"9+":n;
  $("#nl").innerHTML=sorted.map(x=>`<div class="nt ${fresh.has(x.id)?"fr":""}" data-n="${x.id}" data-t="${x.type}" data-u="${x.from}" data-p="${x.postId||""}">${ntxt(x)}<div class="time">${when(x.createdAt)}</div></div>`).join("")||`<div class="pad time">${t("noNotif")}</div>`;
}
$("#bell").onclick=e=>{
  e.stopPropagation();$("#mnu").hidden=true;const p=$("#npn");p.hidden=!p.hidden;
  if(!p.hidden){
    const un=notifs.filter(x=>!x.read);fresh=new Set(un.map(x=>x.id));bellUI();
    if(navigator.onLine)un.forEach(x=>updateDoc(doc(db,"notifs",x.id),{read:true}).catch(()=>{}));
  }
};

$("#sn").onclick=()=>act(async()=>{const n=$("#epn").value.trim();

function catsUI(){$("#cats").innerHTML=CATS.map(c=>`<button class="cc ${c===pcat?"on":""}" data-cc="${c}">${t("c_"+c)}</button>`).join("")}

// ---------- My Day (Stories) ----------
const sts=s=>s.createdAt?.toMillis?.()||Date.now();
function storiesUI(){
  if(!me)return;
  const now=Date.now(),g={};
  stories.filter(s=>now-sts(s)<864e5).forEach(s=>(g[s.uid]=g[s.uid]||[]).push(s));
  Object.values(g).forEach(a=>a.sort((x,y)=>sts(x)-sts(y)));
  sg=g;
  const ids=Object.keys(g).sort((a,b)=>a===me.uid?-1:b===me.uid?1:sts(g[b][g[b].length-1])-sts(g[a][g[a].length-1]));
  $("#sty").innerHTML=`<div class="sc cr" data-s="new"><img src="${esc(av(me.uid))}"><div class="plus">+</div><span>${t("createStory")}</span></div>`
   +ids.map(i=>{const l=g[i][g[i].length-1];
     return `<div class="sc" data-s="${i}" style="${l.image?"":"background:"+esc(l.bg||BG[0])}">${l.image?`<img class="bgi" src="${esc(l.image)}">`:`<div class="stx">${esc(l.text)}</div>`}<img class="ring" src="${esc(av(i))}"><span>${esc(i===me.uid?t("yourStory"):U(i).name)}</span></div>`}).join("");
}
function scrUI(){
  $("#scp").style.background=sFile?"#000":BG[sBg];
  $("#scimg").hidden=!sFile;
  if(sFile)$("#scimg").src=URL.createObjectURL(sFile);
  $("#scd").innerHTML=BG.map((b,i)=>`<button class="cdot ${i===sBg&&!sFile?"on":""}" data-sb="${i}" style="background:${b}"></button>`).join("");
}
function openScr(){sBg=0;sFile=null;$("#sctx").value="";$("#sf").value="";scrUI();$("#scr").hidden=false}
$("#scx").onclick=()=>{$("#scr").hidden=true};
$("#sf").onchange=e=>{sFile=e.target.files[0]||null;scrUI()};
$("#scs").onclick=async()=>{
  if(offl())return;
  const text=$("#sctx").value.trim();if(!text&&!sFile)return;
  const b=$("#scs");b.disabled=true;
  try{
    await addDoc(collection(db,"stories"),{uid:me.uid,text,image:sFile?await shrink(sFile,720,.7):"",bg:sFile?"":BG[sBg],createdAt:serverTimestamp()});
    $("#scr").hidden=true;
  }catch(e){alert(e.message)}
  b.disabled=false;

function closeSv(){clearTimeout(svT);$("#sv").hidden=true}
function showSv(){
  clearTimeout(svT);
  const a=sg[sv.uid]||[],s=a[sv.i];
  if(!s){closeSv();return}
  $("#sv").hidden=false;
  $("#svb").innerHTML=a.map((_,k)=>`<i class="${k<sv.i?"f":k===sv.i?"a":""}"></i>`).join("");
  $("#svh").innerHTML=`<img class="av" src="${esc(av(sv.uid))}" style="width:36px;height:36px"><div style="flex:1;min-width:0"><div class="name">${esc(U(sv.uid).name)}</div><div class="time">${ago(sts(s))}</div></div>${sv.uid===me.uid?`<button class="svx" data-sx="del">${I_TRASH}</button>`:""}<button class="svx" data-sx="close">${I_X}</button>`;
  $("#svc").style.background=s.image?"#000":(s.bg||BG[0]);
  $("#svc").innerHTML=(s.image?`<img src="${esc(s.image)}">`:"")+(s.text?`<div class="svt ${s.image?"cap":""}">${esc(s.text)}</div>`:"");
  svT=setTimeout(()=>{sv.i++;showSv()},5000);
}
function openSv(uid){if(!sg[uid]?.length)return;sv={uid,i:0};showSv()}
function delStory(){
  const s=(sg[sv.uid]||[])[sv.i];if(!s)return;
  if(!confirm(t("delAsk")))return;
  closeSv();act(()=>deleteDoc(doc(db,"stories",s.id)));
}

// ---------- Feed ----------
const img=p=>p.image?`<img class="media" src="${esc(p.image)}" loading="lazy">`:"";
const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?t("agoNow"):m<60?t("agoM",m):m<1440?t("agoH",Math.floor(m/60)):t("agoD",Math.floor(m/1440))};
const seen=i=>on(i)?`<span style="color:#31c552">${t("appOn")}</span>`:(U(i).lastSeen?t("lastOff",ago(U(i).lastSeen)):t("never"));
const mutual=i=>{const a=accIds();return (U(i).fl||[]).filter(x=>a.includes(x)).length};
const person=([i,u])=>`<div class="sg" data-pf="${i}">${avw(i)}<div style="flex:1;min-width:0"><div class="name">${esc(u.name)}</div><div class="time">${i!==me.uid&&mutual(i)?t("mutual",mutual(i))+" · ":""}${seen(i)}</div></div>${i===me.uid?"":fbtn(i)+`<button class="btn ghost" style="padding:5px 10px;font-size:12px" data-dm="${i}">💬</button>`}</div>`;
const chatRow=i=>{const n=unreadN(i);return `<div class="sg" data-dm="${i}">${avw(i)}<span class="name" style="flex:1">${esc(U(i).name)}</span>${n?`<b class="bdg">${n>9?"9+":n}</b>`:""}</div>`};
function postHTML(p){
  const rs=p.reactions||{},vals=Object.values(rs),mine=rs[me.uid],top=[...new Set(vals)].slice(0,3).join("");
  const sh=p.shared?`<div class="shared"><div class="row"><img class="av" src="${esc(av(p.shared.uid))}" style="width:30px;height:30px"><span class="name">${esc(U(p.shared.uid).name)}</span></div><div>${esc(p.shared.text)}</div>${img(p.shared)}</div>`:"";
  const cl=openC.has(p.id)?`<div>${(comments[p.id]||[]).map(c=>`<div class="cm"><img class="av" src="${esc(av(c.uid))}" style="width:30px;height:30px"><div><b>${esc(U(c.uid).name)}</b><br>${esc(c.text)}</div></div>`).join("")}
    <div class="cm"><input data-ci="${p.id}" placeholder="${t("phCm")}" style="margin:0;border-radius:20px"></div></div>`:"";
  return `<div class="card pad" data-id="${p.id}">
    <div class="row"><span data-pf="${p.uid}" style="cursor:pointer">${avw(p.uid)}</span><div><div class="name" data-pf="${p.uid}" style="cursor:pointer">${esc(U(p.uid).name)}${p.shared?` <span class='time'>${t("shareTag")}</span>`:""}</div><div class="time">${when(p.createdAt)}${p.edited?" · "+t("edited"):""}</div></div>
    ${p.uid===me.uid?`<span class="pw"><button class="dots" data-a="menu">${I_DOTS}</button><div class="pmenu" hidden><button data-a="edit">${I_EDIT}<span>${t("edit")}</span></button><button class="rd" data-a="del">${I_TRASH}<span>${t("del")}</span></button></div></span>`:""}</div>
    <div style="margin-top:8px;white-space:pre-wrap">${esc(p.text)}</div>${p.shared?sh:img(p)}
    <div class="sum"><span class="lc">${vals.length?`<span class="emo">${top}</span><span>${vals.length}</span>`:""}</span><span>${p.commentCount?t("nCm",p.commentCount):""}</span></div>
    <div class="acts">
      <div class="lw"><div class="pk">${EMO.map(e=>`<span data-a="react" data-e="${e}">${e}</span>`).join("")}</div>
        <button data-a="like" class="${mine?"me":""}">${mine?`<span class="emo">${mine}</span>`:I_LIKE}<span>${t("like")}</span></button></div>
      <button data-a="cm">${I_CMT}<span>${t("comment")}</span></button><button data-a="share">${I_SHR}<span>${t("share")}</span></button>
    </div>${cl}</div>`;
}
function render(){
  if(!me)return;
  $("#np").textContent=posts.filter(p=>p.uid===me.uid).length;
  const acc=accIds();
  $("#nu").textContent=acc.length;
  const accS=[...acc].sort((a,b)=>on(b)-on(a));
  $("#fl").innerHTML=accS.map(i=>person([i,U(i)])).join("")||`<div class="pad time">${t("noFr")}</div>`;
  $("#fct").innerHTML=`${t("allFr")} · 🟢 ${acc.filter(on).length}/${acc.length} ${t("online")}`;
  const rq=friends.filter(f=>f.status==="pending"&&f.to===me.uid);
  $("#req").innerHTML=rq.map(f=>person([f.from,U(f.from)])).join("");
  $("#reqc").hidden=!rq.length;
  $("#rqn").textContent=rq.length;
  $("#fb").hidden=!rq.length;$("#fb").textContent=rq.length;
  const match=([i,u])=>i!==me.uid&&(!q||(u.name||"").toLowerCase().includes(q));
  $("#sug").innerHTML=Object.entries(users).filter(e=>match(e)&&!friends.some(f=>f.users.includes(e[0])&&(f.status==="accepted"||f.to===me.uid))).slice(0,30).map(person).join("")||`<div class="pad time">${t("none")}</div>`;
  let html;
  if(view){
    const u=U(view),isMe=view===me.uid,fl=(isMe?acc:(u.fl||[])).filter(i=>users[i]);
    const cv=u.cover?`style="background:url('${u.cover}') center/cover"`:"";
    $("#pv").innerHTML=`<div class="card"><button class="btn ghost" data-bk style="margin:10px">${t("back")}</button>
      <div class="cover pcov" ${cv}></div>
      <div class="prof pf2"><span class="aw"><img class="big pb" src="${esc(av(view))}">${on(view)?'<i class="dot"></i>':""}</span>
        <div class="name" style="font-size:22px;margin:8px 0 2px">${esc(u.name)}</div>
        <div class="time" style="margin-bottom:6px">${on(view)?t("onl"):t("offl")}</div></div>
      ${u.bio?`<div class="bio">${esc(u.bio)}</div>`:""}
      <div class="intro">${u.lives?`<div>${t("lives",esc(u.lives))}</div>`:""}${u.work?`<div>${t("works",esc(u.work))}</div>`:""}<div>${t("nFr",fl.length)}</div></div>
      <div class="pad row" style="justify-content:center;flex-wrap:wrap">${isMe?`<button class="btn g" data-edit>${t("editProf")}</button>`
        :`${fbtn(view)}<button class="btn ghost" style="padding:5px 12px;font-size:12px" data-dm="${view}">${t("message")}</button>`}</div>
      <div class="ptabs">${[["posts",t("posts")],["photos",t("photos")],["friends",t("friends")]].map(([k,n])=>`<button data-pt="${k}" class="${ptab===k?"on":""}">${n}</button>`).join("")}</div></div>`;
    $("#cmp").hidden=true;$("#sty").hidden=true;$("#ppl").innerHTML="";
    if(!isMe)$("#ep").hidden=true;
    if(ptab==="photos"){const ph=posts.filter(p=>p.uid===view&&p.image);
      html=`<div class="card pad">${ph.length?`<div class="pg">${ph.map(p=>`<img data-lb src="${esc(p.image)}" loading="lazy">`).join("")}</div>`:`<div class="time">${t("noPhoto")}</div>`}</div>`}
    else if(ptab==="friends")html=`<div class="card">${fl.map(i=>person([i,U(i)])).join("")||`<div class="pad time">${t("noFr")}</div>`}</div>`;
    else html=posts.filter(p=>p.uid===view).map(postHTML).join("")||`<div class="card pad">${t("noPost")}</div>`;
  }else{
    const cat=curCat();
    $("#pv").innerHTML="";$("#ep").hidden=true;$("#cmp").hidden=false;$("#sty").hidden=cat!=="home";
    const found=q?Object.entries(users).filter(match).slice(0,6):[];
    $("#ppl").innerHTML=found.length?`<div class="card"><div class="ct">${t("people")}</div>${found.map(person).join("")}</div>`:"";
    const head=cat!=="home"?`<div class="card ct" style="font-size:17px">${t("c_"+cat)}</div>`:"";
    html=head+(posts.filter(p=>(q||catOf(p)===cat)&&(!q||((p.text||"")+U(p.uid).name).toLowerCase().includes(q))).map(postHTML).join("")||`<div class="card pad">${t("noPost")}</div>`);
  }
  $("#feed").innerHTML=html;
}
document.addEventListener("click",e=>{
  if(!e.target.closest("#npn,#bell"))$("#npn").hidden=true;
  if(!e.target.closest("#mnu,#mb"))$("#mnu").hidden=true;
  if(!e.target.closest(".pw"))$$(".pmenu").forEach(m=>m.hidden=true);
  if(e.target.closest("#lb")){$("#lb").hidden=true;return}
  const cc=e.target.closest("[data-cc]");if(cc){pcat=cc.dataset.cc;catsUI();return}
  const sc=e.target.closest("[data-s]");if(sc){sc.dataset.s==="new"?openScr():openSv(sc.dataset.s);return}
  const sz=e.target.closest("[data-sz]");if(sz){sv.i=Math.max(0,sv.i+(+sz.dataset.sz));showSv();return}
  const sx=e.target.closest("[data-sx]");if(sx){sx.dataset.sx==="close"?closeSv():delStory();return}
  const sb=e.target.closest("[data-sb]");if(sb){sBg=+sb.dataset.sb;sFile=null;$("#sf").value="";scrUI();return}
  const lb=e.target.closest("[data-lb]");if(lb){$("#lb img").src=lb.src;$("#lb").hidden=false;return}
  const nt=e.target.closest("[data-n]");
  if(nt){$("#npn").hidden=true;
    if(nt.dataset.t==="friend")openProfile(nt.dataset.u);
    else{view=null;setTab("home");render();setTimeout(()=>document.querySelector(`[data-id="${nt.dataset.p}"]`)?.scrollIntoView({behavior:"smooth",block:"center"}),60)}
    return}
  if(e.target.closest("[data-bk]")){view=null;setTab("home");render();return}
  const pt=e.target.closest("[data-pt]");if(pt){ptab=pt.dataset.pt;render();return}
  if(e.target.closest("[data-edit]")){const m=U(me.uid);
    $("#epn").value=m.name||"";$("#epb").value=m.bio||"";$("#epl").value=m.lives||"";$("#epw").value=m.work||"";
    $("#ep").hidden=false;$("#ep").scrollIntoView({behavior:"smooth"});return}
  const f=e.target.closest("[data-f]");if(f){friendAct(f.dataset.f,f.dataset.u);return}
  const d=e.target.closest("[data-dm]");if(d){openChat(d.dataset.dm);return}
  const pf=e.target.closest("[data-pf]");if(pf){openProfile(pf.dataset.pf);return}
  const ta=e.target.closest("[data-a]");if(!ta)return;const id=ta.closest(".card")?.dataset.id,p=posts.find(x=>x.id===id),a=ta.dataset.a;
  if(!p)return;
  if(a==="menu"){const m=ta.parentElement.querySelector(".pmenu"),was=m.hidden;$$(".pmenu").forEach(x=>x.hidden=true);m.hidden=!was;return}
  if(a==="react"||a==="like"){
    const mine=p.reactions?.[me.uid];
    const val=a==="react"?(ta.dataset.e===mine?null:ta.dataset.e):(mine?null:"👍");
    act(async()=>{await updateDoc(doc(db,"posts",id),{[`reactions.${me.uid}`]:val===null?deleteField():val});if(val)notify(p.uid,"react",{postId:id,emoji:val})});
  }
  if(a==="cm"){if(openC.has(id))openC.delete(id);else{openC.add(id);subC(id)}render()}
  if(a==="edit"){$$(".pmenu").forEach(x=>x.hidden=true);const nt2=prompt(t("editAsk"),p.text||"");if(nt2===null)return;act(()=>updateDoc(doc(db,"posts",id),{text:nt2.trim(),edited:true}))}
  if(a==="del"){$$(".pmenu").forEach(x=>x.hidden=true);if(confirm(t("delAsk")))act(()=>deleteDoc(doc(db,"posts",id)))}
  if(a==="share"){const note=prompt(t("shareAsk"));if(note===null)return;const s=p.shared||p;
    act(()=>addDoc(collection(db,"posts"),{uid:me.uid,text:note,image:"",cat:catOf(p),reactions:{},commentCount:0,createdAt:serverTimestamp(),
      shared:{uid:s.uid,text:s.text||"",image:s.image||""}}).then(()=>{notify(s.uid,"share",{postId:id});alert(t("shareOk"))}))}
});
// ဖုန်းမှာ Like ကိုဖိထားရင် Emoji ပေါ်
let lp;document.addEventListener("touchstart",e=>{
  if(!e.target.closest(".lw"))$$(".pk.show").forEach(x=>x.classList.remove("show"));
  const b=e.target.closest('[data-a="like"]');if(!b)return;
  lp=setTimeout(()=>b.parentElement.querySelector(".pk").classList.add("show"),350)},{passive:true});
document.addEventListener("touchend",()=>clearTimeout(lp));

const subbed=new Set();
function subC(id){if(subbed.has(id))return;subbed.add(id);
  onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt")),s=>{comments[id]=s.docs.map(d=>d.data());keep(render)})}
document.addEventListener("keydown",e=>{const i=e.target.dataset?.ci;if(!i||e.key!=="Enter")return;const text=e.target.value.trim();if(!text)return;if(offl())return;e.target.value="";
  act(async()=>{await addDoc(collection(db,"posts",i,"comments"),{uid:me.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,"posts",i),{commentCount:increment(1)});notify(posts.find(x=>x.id===i)?.uid,"comment",{postId:i})})});

// ---------- Private Chat ----------
const cid=()=>[me.uid,peer].sort().join("_");
function openChat(id){
  if(!id||id===me.uid)return;
  peer=id;dmMsgs=[];if(unDM)unDM();
  unDM=onSnapshot(query(collection(db,"dms",cid(),"messages"),orderBy("createdAt"),limit(200)),s=>{dmMsgs=s.docs.map(d=>d.data());renderChat();markRead()},
    e=>console.error(e));
  setTab("chat");renderChat();setTimeout(()=>$("#ci").focus(),50);
}
$("#bk").onclick=()=>{peer=null;if(unDM){unDM();unDM=null}dmMsgs=[];renderChat()};
function send(){
  const text=$("#ci").value.trim();if(!text||!peer)return;
  if(offl())return;
  $("#ci").value="";
  act(()=>addDoc(collection(db,"dms",cid(),"messages"),{from:me.uid,text,createdAt:serverTimestamp()}));
}
$("#cs").onclick=send;
$("#ci").onkeydown=e=>{if(e.key==="Enter")send()};
$("#cimg").onchange=e=>act(async()=>{const f=e.target.files[0];if(!f||!peer)return;
  const image=await shrink(f,800,.6);
  await addDoc(collection(db,"dms",cid(),"messages"),{from:me.uid,text:"",image,createdAt:serverTimestamp()});e.target.value=""});
function scrollChat(){const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}
function renderChat(){
  if(!me)return;
  $("#plist").hidden=!!peer;$("#conv").hidden=!peer;
  if(!peer){
    const tt=i=>(lastM[i]||[])[0]?.t||0;
    $("#plist").innerHTML=Object.keys(users).filter(i=>i!==me.uid).sort((a,b)=>tt(b)-tt(a)).map(chatRow).join("")||`<div class="pad time">${t("none")}</div>`;
    return;
  }
  $("#pa").src=av(peer);$("#pnm").textContent=U(peer).name;$("#pd").hidden=!on(peer);
  $("#msgs").innerHTML=dmMsgs.map(m=>`<div class="msg ${m.from===me.uid?"me":""}">${m.image?`<img src="${esc(m.image)}">`:""}${m.text?esc(m.text):""}</div>`).join("");
  scrollChat();
}

// ---------- Apply language ----------
function applyLang(){
  document.documentElement.lang=lang==="my"?"my":"en";
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $$("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
  $("#go").textContent=t(reg?"createBtn":"login");
  $("#sw").textContent=t(reg?"haveAcc":"newAcc");
  $("#lgl").textContent=t("langM");
  $("#lga").textContent=t("langA");
  setTheme(root.classList.contains("dark")?"dark":"light");
  const pb=$("#post");if(!posting)pb.textContent=t("post");
  if(!offB.hidden&&!navigator.onLine)offB.textContent=t("offB");
  catsUI();
  if(me){render();renderChat();bellUI();storiesUI()}
}
const toggleLang=()=>{lang=lang==="my"?"en":"my";try{localStorage.setItem("lang",lang)}catch(e){}$("#mnu").hidden=true;applyLang()};
$("#lgb").onclick=toggleLang;$("#lga").onclick=toggleLang;
applyLang();
</script>
