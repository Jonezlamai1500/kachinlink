<!DOCTYPE html>
<html lang="my"><head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9232d">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kachin Link</title>
<style>
*{box-sizing:border-box}
:root{--r:#d9232d;--g:#1f9d55}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;color:#1c1e21;min-height:100vh;
background:linear-gradient(90deg,var(--r) 50%,var(--g) 50%) fixed}
[hidden]{display:none!important}button{font:inherit;cursor:pointer;border:0}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin:4px 0;outline:0;background:#fff}
input:focus,textarea:focus{border-color:var(--g)}
.btn{background:var(--r);color:#fff;padding:8px 16px;border-radius:6px;font-weight:600}
.btn.g{background:var(--g)}.btn.ghost{background:#eee;color:#333}.btn:disabled{opacity:.5}
.logo{font-size:22px;font-weight:800;color:var(--r)}.logo i{font-style:normal;color:var(--g)}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 4px #0003;margin-bottom:14px;overflow:hidden}
.pad{padding:14px}.ct{font-weight:700;padding:12px 14px;border-bottom:1px solid #eee}
#auth{max-width:380px;margin:8vh auto;padding:26px;background:#fff;border-radius:10px;box-shadow:0 6px 24px #0004;text-align:center}
#auth a{color:var(--g);cursor:pointer;font-size:14px}
nav{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 8px #0003;display:flex;align-items:center;gap:14px;padding:8px 16px}
nav input{max-width:320px;margin:0;background:#f3f3f3;border-radius:20px}nav .sp{flex:1}
.wrap{max-width:1100px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:270px 1fr 300px;gap:16px;align-items:start}
.cover{height:70px;background:linear-gradient(90deg,var(--r) 50%,var(--g) 50%)}
.prof{text-align:center;margin-top:-45px}
.big{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#ccc}
.stats{display:flex;border-top:1px solid #eee}.stats div{flex:1;text-align:center;padding:10px;font-size:13px;color:#777}
.stats b{display:block;font-size:18px;color:#222}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#ccc;flex:none}
.row{display:flex;gap:10px;align-items:center}
.sg{display:flex;gap:10px;align-items:center;padding:8px 14px;cursor:pointer}.sg:hover{background:#f3f3f3}
.top{border-top:3px solid var(--r)}
.name{font-weight:600}.time{font-size:12px;color:#888}
.media{width:calc(100% + 28px);margin:8px -14px 0;max-height:520px;object-fit:contain;background:#111;display:block}
.shared{border:1px solid #ddd;border-radius:6px;padding:10px;margin-top:8px}
.shared .media{width:calc(100% + 20px);margin:8px -10px -10px}
.sum{font-size:13px;color:#777;padding:8px 0;display:flex;justify-content:space-between}
.acts{display:flex;border-top:1px solid #eee;padding-top:4px}.acts>*{flex:1}
.acts button{background:none;color:#777;padding:8px;border-radius:6px;font-weight:600;width:100%}
.acts button:hover{background:#f3f3f3}.acts .me{color:var(--r)}
.lw{position:relative}
.pk{display:none;position:absolute;bottom:42px;left:0;background:#fff;border-radius:30px;box-shadow:0 2px 12px #0005;padding:4px 8px;z-index:5}
.lw:hover .pk,.pk.show{display:flex}
.pk span{font-size:28px;cursor:pointer;padding:2px 4px;transition:transform .12s}.pk span:hover{transform:scale(1.35)}
.cm{display:flex;gap:8px;margin-top:8px}.cm div{background:#f3f3f3;border-radius:16px;padding:6px 12px;font-size:14px}
.del{color:var(--r);font-size:12px;background:none;margin-left:auto}
#prev img{max-width:100%;max-height:240px;border-radius:8px;margin-top:6px}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:12px}
.msg{max-width:80%;background:#eee;padding:6px 12px;border-radius:16px;font-size:14px;align-self:flex-start;word-break:break-word}
.msg.me{background:var(--g);color:#fff;align-self:flex-end}
#tabs{display:none}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;padding-bottom:70px}
 body[data-t=home] #L,body[data-t=home] #R,body[data-t=chat] #L,body[data-t=chat] #C,body[data-t=me] #C,body[data-t=me] #R{display:none}
 #tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 8px #0003;z-index:20}
 #tabs button{flex:1;background:none;padding:12px;font-size:15px}#tabs button.on{color:var(--r);font-weight:700;border-top:3px solid var(--r)}
 nav input{max-width:none}.chat{height:60vh}
}
</style></head><body data-t="home">

<div id="auth">
  <div class="logo" style="font-size:30px">Kachin <i>Link</i></div>
  <p style="color:#777;margin-top:4px">Hkap Tau La Ga Ai</p>
  <input id="rn" placeholder="Name" hidden>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (6 Number )">
  <button class="btn g" id="go" style="width:100%;margin:8px 0">Login</button>
  <div id="err" style="color:var(--r);font-size:13px"></div>
  <a id="sw">New Creat Account</a>
</div>

<div id="app" hidden>
  <nav>
    <div class="logo">Kachin <i>Link</i></div>
    <input id="q" placeholder="🔍 Find...">
    <span class="sp"></span>
    <button class="btn ghost" id="out">Logout</button>
  </nav>

  <div class="wrap">
    <aside id="L">
      <div class="card">
        <div class="cover"></div>
        <div class="prof"><img class="big myav"><div class="name" id="mn" style="font-size:18px;margin:6px 0 10px"></div></div>
        <div class="stats"><div>Posts<b id="np">0</b></div><div>Friends<b id="nu">0</b></div></div>
        <div class="pad" style="border-top:1px solid #eee">
          <label class="btn ghost" style="display:block;text-align:center">📷 ပုံပြောင်းမယ်<input id="avf" type="file" accept="image/*" hidden></label>
          <input id="pn" placeholder="Change Profile ">
          <button class="btn g" id="sn" style="width:100%">Save Profile </button>
        </div>
      </div>
      <div class="card"><div class="ct">Friend Lists</div><div id="sug" style="padding:4px 0"></div></div>
    </aside>

    <main id="C">
      <div class="card top pad">
        <div class="row" style="align-items:flex-start"><img class="av myav"><textarea id="txt" rows="2" placeholder="What's on your mind?"></textarea></div>
        <div id="prev"></div>
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <label class="btn ghost">📷 ပုံထည့်မယ်<input id="file" type="file" accept="image/*" hidden></label>
          <button class="btn" id="post">Post</button>
        </div>
      </div>
      <div id="ppl"></div>
      <div id="feed"></div>
    </main>

    <aside id="R">
      <div class="card"><div class="ct">💬 Messages</div>
        <div id="plist"></div>
        <div id="conv" hidden>
          <div class="row pad" style="border-bottom:1px solid #eee;padding:8px 14px">
            <button class="btn ghost" id="bk" style="padding:6px 12px">←</button>
            <img class="av" id="pa"><b id="pnm"></b>
          </div>
          <div class="chat" id="msgs"></div>
          <div class="row pad" style="padding-top:0"><input id="ci" placeholder="စာရိုက်ပါ..."><button class="btn g" id="cs">ပို့</button></div>
        </div>
      </div>
    </aside>
  </div>

  <div id="tabs"><button data-t="home" class="on">🏠 Home</button><button data-t="chat">💬 Chat</button><button data-t="me">👤 Profile</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,deleteDoc,deleteField,onSnapshot,query,orderBy,limit,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 👇 ကိုယ့် firebaseConfig အဟောင်းကို ဒီမှာ ပြန်ထည့်ပါ
const firebaseConfig = {
  apiKey:"AIzaSyDYL20rK-JgxxOIMVaQwTurlVinXBL9q4k", authDomain:"jinghpaw-link.firebaseapp.com", projectId:"jinghpaw-link",
  storageBucket:"jinghpaw-link.firebasestorage.app", messagingSenderId:"790888296721", appId:"1:790888296721:web:1f238b0be41ac85d631cb0"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMO=["👍","❤️","😂","😮","😢","😡"];
const DEF="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect fill='%23bcc0c4' width='40' height='40'/%3E%3Ccircle cx='20' cy='15' r='7' fill='%23fff'/%3E%3Cellipse cx='20' cy='37' rx='13' ry='11' fill='%23fff'/%3E%3C/svg%3E";
let me=null,users={},posts=[],comments={},openC=new Set(),file=null,reg=false,started=false,q="";
let peer=null,dmMsgs=[],unDM=null;

// ---------- Auth ----------
$("#sw").onclick=()=>{reg=!reg;$("#rn").hidden=!reg;$("#go").textContent=reg?"Creat Account":"Login";$("#sw").textContent=reg?"အကောင့်ရှိပြီးသား - Login":"New Creat Account"};
$("#go").onclick=async()=>{
  $("#err").textContent="";const e=$("#em").value.trim(),p=$("#pw").value;
  try{
    if(reg){const n=$("#rn").value.trim()||e.split("@")[0];const c=await createUserWithEmailAndPassword(auth,e,p);
      await setDoc(doc(db,"users",c.user.uid),{name:n,photo:"",createdAt:serverTimestamp()});}
    else await signInWithEmailAndPassword(auth,e,p);
  }catch(x){$("#err").textContent=x.code||x.message}
};
$("#out").onclick=async()=>{await signOut(auth);location.reload()};
onAuthStateChanged(auth,async u=>{
  if(!u)return;me=u;
  const d=await getDoc(doc(db,"users",u.uid));
  if(!d.exists())await setDoc(doc(db,"users",u.uid),{name:(u.email||"user").split("@")[0],photo:"",createdAt:serverTimestamp()});
  $("#auth").hidden=true;$("#app").hidden=false;
  if(!started){started=true;start()}
});

// ---------- Helpers ----------
const U=id=>users[id]||{name:"User",photo:""};
const av=id=>U(id).photo||DEF;
const when=t=>t?.toDate?t.toDate().toLocaleString("my-MM",{dateStyle:"medium",timeStyle:"short"}):"ယခုလေးတင်";
const act=async fn=>{try{await fn()}catch(e){alert(e.message)}};
function shrink(f,max,q=.72){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;
  c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(f)})}
const setTab=t=>{$$("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));document.body.dataset.t=t};

// ---------- Tabs / Search ----------
$$("#tabs button").forEach(b=>b.onclick=()=>{setTab(b.dataset.t);scrollChat()});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};

// ---------- Live data ----------
function start(){
  onSnapshot(collection(db,"users"),s=>{users={};s.forEach(d=>users[d.id]=d.data());
    $$(".myav").forEach(i=>i.src=av(me.uid));$("#mn").textContent=U(me.uid).name;
    if(document.activeElement!==$("#pn"))$("#pn").value=U(me.uid).name;render();renderChat()});
  onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));render()});
}

// ---------- Compose ----------
$("#file").onchange=e=>{file=e.target.files[0]||null;$("#prev").innerHTML=file?`<img src="${URL.createObjectURL(file)}">`:""};
$("#post").onclick=async()=>{
  const text=$("#txt").value.trim();if(!text&&!file)return;const b=$("#post");b.disabled=true;b.textContent="တင်နေသည်...";
  try{
    const data={uid:me.uid,text,image:file?await shrink(file,900):"",reactions:{},commentCount:0,createdAt:serverTimestamp()};
    await addDoc(collection(db,"posts"),data);
    $("#txt").value="";$("#prev").innerHTML="";file=null;$("#file").value="";
  }catch(e){alert("တင်မရပါ: "+(e.message||e))}
  b.disabled=false;b.textContent="တင်မယ်";
};

// ---------- Feed ----------
const img=p=>p.image?`<img class="media" src="${esc(p.image)}" loading="lazy">`:"";
const person=([i,u])=>`<div class="sg" data-dm="${i}"><img class="av" src="${esc(u.photo||DEF)}"><span class="name">${esc(u.name)}</span></div>`;
function render(){
  if(!me)return;
  $("#np").textContent=posts.filter(p=>p.uid===me.uid).length;$("#nu").textContent=Object.keys(users).length;
  const match=([i,u])=>i!==me.uid&&(!q||(u.name||"").toLowerCase().includes(q));
  $("#sug").innerHTML=Object.entries(users).filter(match).slice(0,8).map(person).join("")||`<div class="pad time">မတွေ့ပါ</div>`;
  const found=q?Object.entries(users).filter(match).slice(0,6):[];
  $("#ppl").innerHTML=found.length?`<div class="card"><div class="ct">👥 လူများ</div>${found.map(person).join("")}</div>`:"";
  const list=posts.filter(p=>!q||((p.text||"")+U(p.uid).name).toLowerCase().includes(q));
  $("#feed").innerHTML=list.map(p=>{
    const rs=p.reactions||{},vals=Object.values(rs),mine=rs[me.uid],top=[...new Set(vals)].slice(0,3).join("");
    const sh=p.shared?`<div class="shared"><div class="row"><img class="av" src="${esc(av(p.shared.uid))}" style="width:30px;height:30px"><span class="name">${esc(U(p.shared.uid).name)}</span></div><div>${esc(p.shared.text)}</div>${img(p.shared)}</div>`:"";
    const cl=openC.has(p.id)?`<div>${(comments[p.id]||[]).map(c=>`<div class="cm"><img class="av" src="${esc(av(c.uid))}" style="width:30px;height:30px"><div><b>${esc(U(c.uid).name)}</b><br>${esc(c.text)}</div></div>`).join("")}
      <div class="cm"><input data-ci="${p.id}" placeholder="Comment...(Enter)" style="margin:0;border-radius:20px"></div></div>`:"";
    return `<div class="card pad" data-id="${p.id}">
      <div class="row"><img class="av" src="${esc(av(p.uid))}"><div><div class="name">${esc(U(p.uid).name)}${p.shared?" <span class='time'>Share</span>":""}</div><div class="time">${when(p.createdAt)}</div></div>
      ${p.uid===me.uid?`<button class="del" data-a="del">Delete</button>`:""}</div>
      <div style="margin-top:8px;white-space:pre-wrap">${esc(p.text)}</div>${p.shared?sh:img(p)}
      <div class="sum"><span>${vals.length?top+" "+vals.length:""}</span><span>${p.commentCount?p.commentCount+" မှတ်ချက်":""}</span></div>
      <div class="acts">
        <div class="lw"><div class="pk">${EMO.map(e=>`<span data-a="react" data-e="${e}">${e}</span>`).join("")}</div>
          <button data-a="like" class="${mine?"me":""}">${mine?mine:"👍 Like"}</button></div>
        <button data-a="cm">💬 Comment</button><button data-a="share">↗️ Share</button>
      </div>${cl}</div>`}).join("")||`<div class="card pad">ပို့စ်မရှိသေးပါ။</div>`;
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-dm]");if(d){openChat(d.dataset.dm);return}
  const t=e.target.closest("[data-a]");if(!t)return;const id=t.closest(".card")?.dataset.id,p=posts.find(x=>x.id===id),a=t.dataset.a;
  if(a==="react"||a==="like"){
    const mine=p.reactions?.[me.uid];
    const val=a==="react"?(t.dataset.e===mine?null:t.dataset.e):(mine?null:"👍");
    act(()=>updateDoc(doc(db,"posts",id),{[`reactions.${me.uid}`]:val===null?deleteField():val}));
  }
  if(a==="cm"){if(openC.has(id))openC.delete(id);else{openC.add(id);subC(id)}render()}
  if(a==="del"&&confirm("ဖျက်မလား?"))act(()=>deleteDoc(doc(db,"posts",id)));
  if(a==="share"){const note=prompt("မှတ်ချက်ထည့်မလား? (မထည့်လည်းရ)");if(note===null)return;const s=p.shared||p;
    act(()=>addDoc(collection(db,"posts"),{uid:me.uid,text:note,image:"",reactions:{},commentCount:0,createdAt:serverTimestamp(),
      shared:{uid:s.uid,text:s.text||"",image:s.image||""}}).then(()=>alert("မျှဝေပြီးပါပြီ ✅")))}
});
// ဖုန်းမှာ Like ကိုဖိထားရင် Emoji ပေါ်
let lp;document.addEventListener("touchstart",e=>{
  if(!e.target.closest(".lw"))$$(".pk.show").forEach(x=>x.classList.remove("show"));
  const b=e.target.closest('[data-a="like"]');if(!b)return;
  lp=setTimeout(()=>b.parentElement.querySelector(".pk").classList.add("show"),350)},{passive:true});
document.addEventListener("touchend",()=>clearTimeout(lp));

const subbed=new Set();
function subC(id){if(subbed.has(id))return;subbed.add(id);
  onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt")),s=>{comments[id]=s.docs.map(d=>d.data());
    const k=document.activeElement?.dataset?.ci,v=document.activeElement?.value;render();
    if(k){const i=$(`[data-ci="${k}"]`);if(i){i.value=v;i.focus()}}})}
document.addEventListener("keydown",e=>{const i=e.target.dataset?.ci;if(!i||e.key!=="Enter")return;const text=e.target.value.trim();if(!text)return;e.target.value="";
  act(async()=>{await addDoc(collection(db,"posts",i,"comments"),{uid:me.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,"posts",i),{commentCount:increment(1)})})});

// ---------- Private Chat ----------
const cid=()=>[me.uid,peer].sort().join("_");
function openChat(id){
  if(!id||id===me.uid)return;
  peer=id;dmMsgs=[];if(unDM)unDM();
  unDM=onSnapshot(query(collection(db,"dms",cid(),"messages"),orderBy("createdAt"),limit(200)),s=>{dmMsgs=s.docs.map(d=>d.data());renderChat()},
    e=>alert("Chat ဖွင့်မရပါ: "+e.message));
  setTab("chat");renderChat();setTimeout(()=>$("#ci").focus(),50);
}
$("#bk").onclick=()=>{peer=null;if(unDM){unDM();unDM=null}dmMsgs=[];renderChat()};
function renderChat(){
  if(!me)return;
  $("#plist").hidden=!!peer;$("#conv").hidden=!peer;
  if(!peer){
    $("#plist").innerHTML=Object.entries(users).filter(([i])=>i!==me.uid).map(person).join("")||`<div class="pad time">အဖွဲ့ဝင် မရှိသေးပါ</div>`;
    return;
  }
  $("#pa").src=av(peer);$("#pnm").textContent=U(peer).name;
  $("#msgs").innerHTML=dmMsgs.map(c=>`<div class="msg ${c.uid===me.uid?"me":""}">${esc(c.text)}</div>`).join("")||`<div class="time" style="text-align:center">စကားစပြောလိုက်ပါ 👋</div>`;
  scrollChat();
}
const scrollChat=()=>{const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight};
const send=async()=>{const t=$("#ci").value.trim();if(!t||!peer)return;$("#ci").value="";
  act(()=>addDoc(collection(db,"dms",cid(),"messages"),{uid:me.uid,text:t,createdAt:serverTimestamp()}))};
$("#cs").onclick=send;$("#ci").onkeydown=e=>{if(e.key==="Enter")send()};

// ---------- Profile ----------
$("#avf").onchange=e=>{const f=e.target.files[0];if(f)act(async()=>{await updateDoc(doc(db,"users",me.uid),{photo:await shrink(f,240,.8)})})};
$("#sn").onclick=()=>{const n=$("#pn").value.trim();if(n)act(async()=>{await updateDoc(doc(db,"users",me.uid),{name:n});alert("သိမ်းပြီးပါပြီ ✅")})};
</script>
</body></html>
