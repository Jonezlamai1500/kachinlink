<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kachin Link</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#eee;
background:linear-gradient(90deg,#d62828 50%,#1b9c4a 50%);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#242628;border-radius:20px;padding:28px 22px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h1{text-align:center;margin:0 0 20px;font-size:32px}
h1 .r{color:#d62828}h1 .g{color:#1b9c4a}
.tabs{display:flex;border-bottom:2px solid #444;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:12px;cursor:pointer;color:#999;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:#fff;border-color:#1b9c4a}
input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid #444;background:#3a3b3f;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#1b9c4a;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.err{color:#ff5252;min-height:20px;margin-bottom:8px;font-size:14px}
#chat{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{width:auto;padding:8px 14px;background:#d62828;font-size:14px}
#msgs{height:55vh;overflow-y:auto;background:#1a1b1d;border-radius:12px;padding:12px;margin-bottom:12px}
.m{margin-bottom:10px;word-wrap:break-word}
.m b{color:#1b9c4a}.m.me b{color:#ff6b6b}
.m small{color:#777;margin-left:6px}
.row{display:flex;gap:8px}
.row input{margin:0}.row button{width:90px}
</style>
</head>
<body>
<div class="card">
  <h1><span class="r">Kachin</span> <span class="g">Link</span></h1>

  <div id="auth">
    <div class="tabs">
      <div class="tab on" id="t-login">ဝင်မယ်</div>
      <div class="tab" id="t-reg">အကောင့်ဖွင့်မယ်</div>
    </div>
    <input id="u" placeholder="နာမည်" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button id="go">ဝင်မယ်</button>
  </div>

  <div id="chat">
    <div class="top"><span id="who"></span><button id="out">ထွက်မယ်</button></div>
    <div id="msgs"></div>
    <div class="row">
      <input id="txt" placeholder="စာရိုက်ပါ..." maxlength="500">
      <button id="send">ပို့မယ်</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'login', token = localStorage.getItem('kl_token'), me = '', timer = null;

async function api(path, method, body) {
  const r = await fetch('/api/' + path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token || '') },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}

function setMode(m) {
  mode = m;
  $('t-login').classList.toggle('on', m === 'login');
  $('t-reg').classList.toggle('on', m === 'reg');
  $('go').textContent = m === 'login' ? 'ဝင်မယ်' : 'အကောင့်ဖွင့်မယ်';
  $('err').textContent = '';
}
$('t-login').onclick = () => setMode('login');
$('t-reg').onclick = () => setMode('reg');

$('go').onclick = async () => {
  $('err').textContent = '';
  try {
    const d = await api(mode === 'login' ? 'login' : 'register', 'POST',
      { username: $('u').value, password: $('p').value });
    token = d.token; me = d.username;
    localStorage.setItem('kl_token', token);
    showChat();
  } catch (e) { $('err').textContent = e.message; }
};

function showChat() {
  $('auth').style.display = 'none';
  $('chat').style.display = 'block';
  $('who').textContent = '👤 ' + me;
  load();
  timer = setInterval(load, 3000);
}

function showAuth() {
  clearInterval(timer);
  $('chat').style.display = 'none';
  $('auth').style.display = 'block';
}

async function load() {
  try {
    const d = await api('messages');
    const box = $('msgs');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = '';
    d.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'm' + (m.user === me ? ' me' : '');
      const b = document.createElement('b'); b.textContent = m.user;
      const s = document.createElement('small');
      s.textContent = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const t = document.createElement('div'); t.textContent = m.text;
      div.append(b, s, t);
      box.appendChild(div);
    });
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (e) {
    localStorage.removeItem('kl_token'); token = null; showAuth();
  }
}

async function sendMsg() {
  const text = $('txt').value.trim();
  if (!text) return;
  $('txt').value = '';
  try { await api('messages', 'POST', { text }); await load(); $('msgs').scrollTop = 1e9; } catch (e) {}
}
$('send').onclick = sendMsg;
$('txt').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

$('out').onclick = async () => {
  try { await api('logout', 'POST'); } catch (e) {}
  localStorage.removeItem('kl_token'); token = null; showAuth();
};

if (token) api('me').then(d => { me = d.username; showChat(); }).catch(() => { localStorage.removeItem('kl_token'); });
</script>
</body>
</html>
