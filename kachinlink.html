<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kachin Link</title>
<style>
:root{--red:#d62828;--green:#1b9e4b;--bg:#f0f2f5;--card:#fff;--text:#050505;--sub:#65676b;--line:#dddfe2;--hover:#f2f2f2;--input:#f0f2f5}
@media(prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--text:#e4e6eb;--sub:#b0b3b8;--line:#3e4042;--hover:#3a3b3c;--input:#3a3b3c}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Noto Sans Myanmar","Myanmar Text",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 1fr;height:54px;box-shadow:0 2px 6px rgba(0,0,0,.25);color:#fff}
.hl{background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.hr{background:var(--green);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 3px}
.logo{font-size:25px;font-weight:800;letter-spacing:-.5px}
.hr .tools{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.dot{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#aaa;border:2px solid var(--green)}
.dot.on{background:#7CFF9B}.dot.off{background:#ffb4b4}
main{max-width:600px;margin:0 auto;padding:12px 8px 40px}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:12px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.av.sm{width:32px;height:32px;font-size:13px}
.hbtn.me{background:none;padding:0}.hbtn.me .av{width:34px;height:34px;border:2px solid #fff}
.composer{padding:12px;border-top:4px solid;border-image:linear-gradient(90deg,var(--red) 50%,var(--green) 50%) 1}
.row{display:flex;gap:10px;align-items:flex-start}
.composer textarea{flex:1;border:0;background:var(--input);color:var(--text);border-radius:20px;padding:9px 14px;font:inherit;resize:none;min-height:42px;outline:none}
#preview{margin-top:10px;position:relative;display:none}
#preview img{width:100%;border-radius:8px;max-height:260px;object-fit:cover}
#preview button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.btn{border:0;font:inherit;font-weight:600;cursor:pointer;border-radius:6px}
.photo{background:none;color:var(--sub);padding:8px 10px}
.photo:active{background:var(--hover)}
.post-btn{background:var(--green);color:#fff;padding:8px 22px}
.post-btn:disabled{opacity:.45}
.head{display:flex;gap:10px;padding:12px 12px 4px;align-items:center}
.head .meta{flex:1}
.name{font-weight:600;font-size:15px;line-height:1.2}
.time{font-size:12px;color:var(--sub)}
.del{background:none;border:0;color:var(--red);font-size:18px;padding:4px 10px;border-radius:50%}
.del:active{background:var(--hover)}
.body{padding:6px 12px 10px;white-space:pre-wrap;word-break:break-word;font-size:16px}
.body.big{font-size:22px;padding-bottom:14px}
.pic{width:100%;display:block;max-height:480px;object-fit:cover}
.stats{display:flex;justify-content:space-between;padding:10px 12px;font-size:14px;color:var(--sub)}
.stats .link{cursor:pointer}
.stats .likes b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--red);font-size:10px;align-items:center;justify-content:center;margin-right:5px}
.actions{display:flex;margin:0 12px;border-top:1px solid var(--line);padding:4px 0}
.actions button{flex:1;background:none;border:0;color:var(--sub);font:inherit;font-weight:600;font-size:14px;padding:8px 0;border-radius:6px;cursor:pointer}
.actions button:active{background:var(--hover)}
.actions button.on{color:var(--red)}
.actions button.on .ico{display:inline-block;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.4)}}
@media(prefers-reduced-motion:reduce){.actions button.on .ico{animation:none}}
.comments{padding:4px 12px 12px;border-top:1px solid var(--line);display:none}
.comments.open{display:block}
.cm{display:flex;gap:8px;margin-top:10px}
.bubble{background:var(--input);padding:6px 12px;border-radius:16px;max-width:calc(100% - 40px)}
.bubble .name{font-size:13px}
.bubble p{font-size:15px;word-break:break-word;white-space:pre-wrap}
.cform{display:flex;gap:8px;margin-top:12px;align-items:center}
.cform input{flex:1;border:0;background:var(--input);color:var(--text);padding:9px 14px;border-radius:20px;font:inherit;outline:none;min-width:0}
.cform button{background:none;border:0;color:var(--green);font:inherit;font-weight:700;padding:6px}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.banner{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px;display:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#323232;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;transition:transform .25s;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#auth{position:fixed;inset:0;z-index:40;background:linear-gradient(90deg,var(--red) 50%,var(--green) 50%);display:none;align-items:center;justify-content:center;padding:16px}
#auth.show{display:flex}
.abox{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.abox h1{font-size:28px;text-align:center;margin-bottom:14px}
.abox h1 i{font-style:normal;color:var(--red)}.abox h1 u{text-decoration:none;color:var(--green)}
.tabs{display:flex;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);font:inherit;font-weight:600;padding:8px;cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--green)}
.abox input{width:100%;margin-bottom:10px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:8px;padding:11px 12px;font:inherit;outline:none}
.abox .go{width:100%;background:var(--green);color:#fff;padding:11px;font-size:16px}
.abox .srv{width:100%;background:none;color:var(--sub);margin-top:8px;font-size:13px;font-weight:400}
#aerr{color:var(--red);font-size:14px;min-height:22px;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div class="hl"><span class="logo">Kachin</span></div>
  <div class="hr">
    <span class="logo">Link</span>
    <div class="tools">
      <button class="hbtn" id="srvBtn" title="Server လိပ်စာ">⚙️<span class="dot" id="dot"></span></button>
      <button class="hbtn me" id="meBtn" title="အကောင့်မှ ထွက်မယ်"><div class="av" id="meAv"></div></button>
    </div>
  </div>
</header>

<main>
  <div class="banner" id="banner">Server နဲ့ မချိတ်မိပါ။ ⚙️ ကိုနှိပ်ပြီး Server လိပ်စာ စစ်ပါ။ (နောက်ဆုံးမြင်ခဲ့တဲ့ Post တွေကိုသာ ပြထားပါတယ်)</div>
  <section class="card composer">
    <div class="row">
      <div class="av" id="cAv"></div>
      <textarea id="text" rows="1" placeholder="ဘာတွေ တွေးနေလဲ?"></textarea>
    </div>
    <div id="preview"><img id="prevImg" alt=""><button id="rmImg" aria-label="ပုံဖယ်မယ်">×</button></div>
    <div class="bar">
      <button class="btn photo" id="photoBtn">🖼️ ဓာတ်ပုံ</button>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn post-btn" id="postBtn" disabled>တင်မယ်</button>
    </div>
  </section>
  <div id="feed"></div>
</main>
<div id="auth"><div class="abox">
  <h1><i>Kachin</i> <u>Link</u></h1>
  <div class="tabs"><button id="tLogin" class="on">ဝင်မယ်</button><button id="tReg">အကောင့်ဖွင့်မယ်</button></div>
  <input id="aUser" placeholder="Username (a-z, 0-9)" autocapitalize="none" autocomplete="username" maxlength="20">
  <input id="aName" placeholder="ပြသမယ့်နာမည်" maxlength="24" style="display:none">
  <input id="aPass" type="password" placeholder="Password (၆ လုံးအထက်)" autocomplete="current-password" maxlength="64">
  <div id="aerr"></div>
  <button class="btn go" id="aGo">ဝင်မယ်</button>
  <button class="btn srv" id="aSrv">⚙️ Server လိပ်စာ ပြောင်းမယ်</button>
</div></div>
<div id="toast"></div>

<script>
// ===== Settings =====
// Termux ထဲမှာ server run ရင် http://localhost:3000 ကို သုံးပါ။ အခြားနေရာမှာ host လုပ်ထားရင် ⚙️ နှိပ်ပြီး ပြောင်းပါ။
const DEFAULT_API = 'http://localhost:3000';
const COLORS = ['#d62828','#1b9e4b','#1877f2','#f7b928','#8e44ad','#16a085','#e67e22'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorOf = n => COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const initial = n => [...String(n).trim()][0] || '?';
const avatar = (n, cls='') => `<div class="av ${cls}" style="background:${colorOf(n)}">${esc(initial(n))}</div>`;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

let API = store.get('kl_api', DEFAULT_API);
let token = store.get('kl_token', '');
let user = store.get('kl_name', '');
let uid = store.get('kl_uid', '');
let posts = [];
try { posts = JSON.parse(store.get('kl_cache', '[]')); } catch(e){}
let online = false, pendingImg = null, lastSig = '';
const openComments = new Set();

// ===== Server calls =====
async function api(path, method='GET', data){
  const headers = {'Content-Type':'application/json'};
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(API + path, { method, headers, body: data ? JSON.stringify(data) : undefined });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    const e = new Error(j.error || ('Error ' + r.status)); e.status = r.status;
    if (r.status === 401 && token) logout();
    throw e;
  }
  return r.json();
}
function setOnline(v){
  online = v;
  $('dot').className = 'dot ' + (v ? 'on' : 'off');
  $('banner').style.display = v ? 'none' : 'block';
}
async function refresh(force){
  try {
    const list = await api('/api/posts');
    setOnline(true);
    const sig = JSON.stringify(list);
    if (sig === lastSig && !force) return;
    const a = document.activeElement;
    if (!force && a && (a.matches('.cform input') || a === $('text'))) return; // ရေးနေတုန်း မနှောက်ယှက်ဖို့
    lastSig = sig; posts = list; store.set('kl_cache', sig.length < 2e6 ? sig : '[]'); render();
  } catch(e){ setOnline(false); render(); }
}
async function act(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); await refresh(true); }
  catch(e){ if (e.status) toast(e.message); else { setOnline(false); toast('Server နဲ့ ချိတ်လို့မရပါ'); } }
}

// ===== UI =====
let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }
function ago(t){
  const s = Math.floor((Date.now()-t)/1000);
  if (s < 60) return 'ခုနကပဲ';
  if (s < 3600) return Math.floor(s/60)+' မိနစ်က';
  if (s < 86400) return Math.floor(s/3600)+' နာရီက';
  return Math.floor(s/86400)+' ရက်က';
}
function renderMe(){
  const c = colorOf(user), i = esc(initial(user));
  $('meAv').style.background = c; $('meAv').textContent = initial(user);
  $('cAv').style.background = c; $('cAv').textContent = initial(user);
}
function render(){
  const feed = $('feed');
  if (!posts.length) { feed.innerHTML = '<div class="empty">Post မရှိသေးပါ။ ပထမဆုံး Post ကို တင်လိုက်ပါ!</div>'; return; }
  feed.innerHTML = posts.map(p => `
  <article class="card" data-id="${p.id}">
    <div class="head">${avatar(p.author)}
      <div class="meta"><div class="name">${esc(p.author)}</div><div class="time">${ago(p.time)}</div></div>
      ${p.uid===uid?'<button class="del" data-a="del" aria-label="ဖျက်မယ်">🗑</button>':''}
    </div>
    ${p.text?`<div class="body ${!p.img&&p.text.length<60?'big':''}">${esc(p.text)}</div>`:''}
    ${p.img?`<img class="pic" src="${esc(p.img)}" alt="">`:''}
    <div class="stats">
      <span>${p.likes?`<span class="likes"><b>❤️</b>${p.likes}</span>`:''}</span>
      <span><span class="link" data-a="toggle">Comment ${p.comments.length}</span> · Share ${p.shares}</span>
    </div>
    <div class="actions">
      <button data-a="like" class="${p.liked?'on':''}"><span class="ico">${p.liked?'❤️':'🤍'}</span> Like</button>
      <button data-a="toggle">💬 Comment</button>
      <button data-a="share">↗️ Share</button>
    </div>
    <div class="comments ${openComments.has(p.id)?'open':''}">
      ${p.comments.map(c=>`<div class="cm">${avatar(c.author,'sm')}<div class="bubble"><div class="name">${esc(c.author)}</div><p>${esc(c.text)}</p></div></div>`).join('')}
      <div class="cform">${avatar(user,'sm')}<input placeholder="Comment ရေးပါ..." maxlength="500"><button data-a="send">ပို့</button></div>
    </div>
  </article>`).join('');
}

// Composer
const ta = $('text');
const check = () => { $('postBtn').disabled = !(ta.value.trim() || pendingImg); };
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,160)+'px'; check(); });
$('photoBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      pendingImg = c.toDataURL('image/jpeg',.72);
      $('prevImg').src = pendingImg; $('preview').style.display='block'; check();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f); e.target.value='';
};
$('rmImg').onclick = () => { pendingImg=null; $('preview').style.display='none'; check(); };
$('postBtn').onclick = () => {
  const text = ta.value.trim(); if (!text && !pendingImg) return;
  const img = pendingImg;
  act(async () => {
    await api('/api/posts','POST',{uid,author:user,text,img});
    ta.value=''; ta.style.height='auto'; pendingImg=null; $('preview').style.display='none'; check();
  }, 'Post တင်ပြီးပါပြီ');
};

// Feed actions
$('feed').addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const card = b.closest('.card'), id = +card.dataset.id, p = posts.find(x=>x.id===id), a = b.dataset.a;
  if (!p) return;
  if (a==='like'){
    p.liked=!p.liked; p.likes+=p.liked?1:-1; render(); // ချက်ချင်းပြောင်းပြပြီး server ကိုပို့
    act(() => api(`/api/posts/${id}/like`,'POST',{uid}));
  } else if (a==='toggle'){
    openComments.has(id)?openComments.delete(id):openComments.add(id); render();
    if (openComments.has(id)) document.querySelector(`[data-id="${id}"] .cform input`).focus();
  } else if (a==='send'){ sendComment(card,p); }
  else if (a==='del'){ if (confirm('ဒီ Post ကို ဖျက်မလား?')) act(() => api(`/api/posts/${id}?uid=${encodeURIComponent(uid)}`,'DELETE'), 'ဖျက်ပြီးပါပြီ'); }
  else if (a==='share'){
    const txt = (p.text||'ဓာတ်ပုံ Post') + '\n— '+p.author+' (Kachin Link)';
    try {
      if (navigator.share) await navigator.share({title:'Kachin Link',text:txt});
      else { await navigator.clipboard.writeText(txt); toast('Copy ကူးပြီးပါပြီ၊ ကြိုက်တဲ့နေရာ Paste လုပ်ပါ'); }
    } catch(err){ if (err && err.name==='AbortError') return; }
    act(() => api(`/api/posts/${id}/share`,'POST',{uid}));
  }
});
$('feed').addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.matches('.cform input')){ const c=e.target.closest('.card'); sendComment(c, posts.find(x=>x.id===+c.dataset.id)); }
});
function sendComment(card,p){
  const v = card.querySelector('.cform input').value.trim(); if (!v) return;
  openComments.add(p.id);
  act(() => api(`/api/posts/${p.id}/comments`,'POST',{uid,author:user,text:v}));
}

// Rename + server address
// Login / Register / Logout
let mode = 'login';
function showAuth(){ $('auth').classList.add('show'); }
function setMode(m){
  mode = m;
  $('tLogin').classList.toggle('on', m==='login'); $('tReg').classList.toggle('on', m==='reg');
  $('aName').style.display = m==='reg' ? 'block' : 'none';
  $('aGo').textContent = m==='reg' ? 'အကောင့်ဖွင့်မယ်' : 'ဝင်မယ်';
  $('aerr').textContent = '';
}
function logout(){
  token = uid = user = ''; posts = []; lastSig = '';
  ['kl_token','kl_uid','kl_name','kl_cache'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  renderMe(); render(); showAuth();
}
async function submitAuth(){
  $('aerr').textContent = '';
  try {
    const r = await api(mode==='reg' ? '/api/register' : '/api/login', 'POST',
      {username:$('aUser').value, name:$('aName').value, password:$('aPass').value});
    token = r.token; uid = r.uid; user = r.name;
    store.set('kl_token', token); store.set('kl_uid', uid); store.set('kl_name', user);
    $('aPass').value = ''; $('auth').classList.remove('show');
    renderMe(); setOnline(true); refresh(true); toast('ကြိုဆိုပါတယ် ' + user);
  } catch(e){ $('aerr').textContent = e.status ? e.message : 'Server နဲ့ ချိတ်လို့မရပါ (အောက်က ⚙️ နဲ့ လိပ်စာစစ်ပါ)'; }
}
$('tLogin').onclick = () => setMode('login');
$('tReg').onclick = () => setMode('reg');
$('aGo').onclick = submitAuth;
$('aPass').addEventListener('keydown', e => { if (e.key==='Enter') submitAuth(); });
$('aSrv').onclick = () => $('srvBtn').click();
$('meBtn').onclick = () => { if (confirm((user||'') + ' အကောင့်မှ ထွက်မလား?')) logout(); };
$('srvBtn').onclick = () => {
  const s = prompt('Server လိပ်စာ (ဥပမာ http://localhost:3000 သို့မဟုတ် https://your-app.onrender.com)', API);
  if (s && s.trim()){ API = s.trim().replace(/\/+$/,''); store.set('kl_api', API); refresh(true); }
};

renderMe(); render();
if (token) refresh(true); else showAuth();
setInterval(() => { if (token) refresh(false); }, 8000);
</script>
</body>
</html>
