name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm init -y
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/push-notifications
      - run: |
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.kachinlink.app","appName":"Kachin Link","webDir":"public"}
          EOF
      - run: npx cap add android
      - name: Permissions and Firebase
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          if [ -f google-services.json ]; then cp google-services.json android/app/; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kachinlink-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
