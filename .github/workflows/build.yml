name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm init -y
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.kachinlink.app","appName":"Kachin Link","webDir":"public"}
          EOF
      - run: npx cap add android
      - run: pip install pillow
      - run: rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: python3 -c "from PIL import Image; im=Image.open('Kachinlink.png').convert('RGBA'); [im.resize((s,s),Image.LANCZOS).save('android/app/src/main/res/mipmap-'+n+'/'+f+'.png') for n,s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)] for f in ['ic_launcher','ic_launcher_round','ic_launcher_foreground']]"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
