name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm init -y
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kachinlink.app",
            "appName": "Kachin Link",
            "webDir": "public"
          }
          EOF
      - run: npx cap add android
      - name: Copy Custom App Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          if [ -f "public/Kachinlink.jpg" ]; then
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-mdpi/ic_launcher.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-hdpi/ic_launcher.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.jpg
            cp public/Kachinlink.jpg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v5-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
